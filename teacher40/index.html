<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحدّي معلم 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: two faces of one page. Host = projector dashboard (lobby with join code → race lanes + leaderboard → podium). Player = phone-first single column (code + name → wait → four stages → finish). */
:root{
  color-scheme:dark;
  --space:#0A0F2C; --panel:#141B45; --panel-2:#1C2558; --ink:#EEF1FF; --muted:#A2AAD6; --line:#2C3670;
  --sun:#FFB547; --sun-ink:#1F1300; --good:#4FD69C; --bad:#FF6B7A;
  --p1:#D08455; --p2:#F2C94C; --p3:#6B9BFF; --p4:#5FE0EC;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1B2560 0%,transparent 70%) fixed,var(--space);color:var(--ink);font-family:var(--f-body);font-size:clamp(16px,1.5vw,20px);line-height:1.65;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3.5vw,44px);padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.wrap.narrow{max-width:640px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-family:var(--f-display);font-size:clamp(1.9rem,4.6vw,3.4rem)}
h2{font-weight:700;font-size:clamp(1.3rem,3vw,2rem)}
h3{font-weight:700;font-size:1.05em}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--p4);outline-offset:3px}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-weight:700;font-size:.85em;color:var(--sun)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 22px;background:var(--sun);color:var(--sun-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85em}
.btn.big{font-size:1.2em;padding:14px 30px}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:6px;font-weight:500}
input[type=text]{width:100%;font:inherit;font-size:1.2em;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--space);color:var(--ink)}
input.code{font-family:var(--f-mono);letter-spacing:.3em;text-align:center;direction:ltr}
.notice{border:1px dashed var(--line);border-radius:14px;padding:14px 18px;color:var(--muted)}
.err{color:var(--bad);font-weight:500}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.2em}
.brand .num{color:var(--p4)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.8em;color:var(--muted)}
.pill .live{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.warn .live{background:var(--bad)}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.choose{grid-template-columns:1fr}}

.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini span{height:8px;border-radius:99px;background:var(--line)}
.mini span.on{background:var(--c)}
.era-head{display:flex;gap:14px;align-items:center}
.badge{width:64px;height:64px;flex:none;border-radius:16px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.1em;color:#0A0F2C;background:var(--c)}
.fact{background:var(--panel-2);border-radius:14px;padding:12px 16px;border-inline-start:4px solid var(--c)}
.fact ul{margin:6px 0 0;padding-inline-start:1.1em;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.opt .l{font-family:var(--f-mono);font-weight:700;width:2em;height:2em;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--space);color:var(--sun)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel-2))}
.opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel-2))}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 16px;background:var(--panel-2)}
.feedback b{color:var(--good)}
.feedback.no b{color:var(--bad)}
.score-chip{font-weight:700;color:var(--sun)}

.join-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:700px){.join-box{grid-template-columns:1fr;justify-items:center;text-align:center}}
.qr{background:#fff;border-radius:14px;padding:10px;width:200px;height:200px;display:grid;place-items:center}
.qr img,.qr svg{width:100%;height:100%}
.bigcode{font-family:var(--f-mono);font-weight:700;font-size:clamp(3rem,9vw,6rem);letter-spacing:.12em;color:var(--p4);direction:ltr;line-height:1}
.link{font-family:var(--f-mono);font-size:.8em;direction:ltr;color:var(--muted);overflow-wrap:anywhere}
.joined{display:flex;flex-wrap:wrap;gap:10px}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:99px;padding:8px 16px;font-weight:500}
.who .dot{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.who.off{opacity:.45}
.count{font-family:var(--f-mono);font-weight:700;font-size:2em;color:var(--p4)}

.dash{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:1fr}}
.lanes{display:flex;flex-direction:column;gap:10px}
.lane-head,.lane{display:grid;grid-template-columns:9rem minmax(0,1fr) 3.5rem;gap:12px;align-items:center}
.lane-head{font-size:.75em;color:var(--muted)}
.lane-head .marks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center}
.lane .nm{display:flex;align-items:center;gap:8px;min-width:0}
.lane .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.track{position:relative;height:30px;border-radius:99px;background:var(--space);border:1px solid var(--line);overflow:hidden}
.track .seg{position:absolute;inset-block:0;width:0;border-inline-start:1px dashed var(--line)}
.track .fill{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(to left,var(--p1),var(--p2),var(--p3),var(--p4));opacity:.4;transition:width .6s ease}
.track .tok{position:absolute;top:2px;width:24px;height:24px;border-radius:50%;background:var(--tc);border:2px solid var(--space);transition:inset-inline-start .6s ease}
.lane .pt{font-family:var(--f-mono);font-weight:700;text-align:left}
.lane.done .track{border-color:var(--sun)}
.lane.off{opacity:.5}
@media (max-width:560px){.lane,.lane-head{grid-template-columns:6rem minmax(0,1fr) 2.8rem}}
.board{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:8px 12px}
.row .rk{font-family:var(--f-mono);font-weight:700;width:1.6em;color:var(--sun)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{font-size:.75em;color:var(--good);white-space:nowrap}
.row .pt{font-family:var(--f-mono);font-weight:700}
.row.first{border:2px solid var(--sun)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;text-align:center}
.step{background:var(--panel-2);border-radius:14px 14px 0 0;padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:flex-end;min-width:0}
.step .medal{font-family:var(--f-mono);font-weight:700;font-size:1.6em}
.step .nm{font-weight:700;overflow-wrap:anywhere}
.step.g1{min-height:220px;border:2px solid var(--sun)}.step.g1 .medal{color:var(--sun)}
.step.g2{min-height:170px}.step.g3{min-height:140px}
.in{animation:rise .4s ease both}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.art{display:block;width:100%;height:auto;border-radius:16px}
.art.photo{aspect-ratio:16/9;object-fit:cover;background:var(--panel-2)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.strip figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.strip figcaption{font-size:.8em;color:var(--muted);text-align:center}
.sound{display:inline-flex;gap:8px;flex-wrap:wrap}
.sound .btn[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.smoke circle{animation:smoke 4s ease-in-out infinite}
.smoke circle:nth-child(2){animation-delay:.6s}.smoke circle:nth-child(3){animation-delay:1.2s}
@keyframes smoke{0%{transform:translateY(6px);opacity:.15}50%{opacity:.55}100%{transform:translateY(-10px);opacity:0}}
.glow{animation:glow 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes glow{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.45;transform:scale(1.08)}}
.belt{animation:belt 3s linear infinite}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.blink{animation:blink 1.8s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.5s}.blink:nth-of-type(3n){animation-delay:1s}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap narrow"><div class="card"><h1>تحدّي معلم 4.0</h1><p class="muted">جاري التحميل…</p></div></div>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

    Object.assign(rec,{name:d.name.slice(0,30),color:/^#[0-9A-Fa-f]{6}$/.test(d.color)?d.color:"#A2AAD6",
      si:cur?Math.min(3,Math.max(0,+d.si||0)):0,n:cur?Math.min(TOTAL,Math.max(0,+d.n||0)):0,score:cur?Math.min(200,Math.max(0,+d.score||0)):0,done:cur&&d.done===true});
    const isNew=!H.players[pid];
    if(isNew&&H.phase==="lobby")Sound.pop();
    if(H.phase==="play"&&cur){
      H.firsts=H.firsts||{};
      if(rec.si>0&&!H.firsts[rec.si]){H.firsts[rec.si]=pid;Sound.stageFx(rec.si)}
      if(rec.done&&!H.order.length)Sound.sfx("fanfare");
    }
    if(rec.done&&!H.order.includes(pid))H.order.push(pid);
    H.players[pid]=rec;saveH();
    if(d.epoch!==H.epoch)try{c.send(gameMsg())}catch(e){}
    renderHostSoon();
  }
  let rT=null;function renderHostSoon(){if(!rT)rT=setTimeout(()=>{rT=null;renderHost()},150)}
  const ranked=()=>Object.keys(H.players).map(id=>({id,...H.players[id],arr:H.order.indexOf(id)}))
    .sort((a,b)=>b.score-a.score||((a.arr<0?1e9:a.arr)-(b.arr<0?1e9:b.arr))||b.n-a.n);
  function setPhase(ph){
    const was=H.phase;H.phase=ph;if(ph==="lobby"||(ph==="play"&&was==="lobby"))H.firsts={};saveH();broadcast();renderHost();
    if(ph==="play"&&was==="lobby"){Sound.startMusic();Sound.level=.3;Sound.stageFx(0)}
    if(ph==="over"){const w=ranked()[0];Sound.setLevel(.5);Sound.sfx("fanfare");}
    if(ph==="lobby")Sound.setLevel(.5);
  }
  function soundControls(){
    const m=el("button",{class:"btn ghost small","aria-pressed":String(Sound.on),text:Sound.on?"🎵 الموسيقى: تعمل":"🎵 شغّل الموسيقى",onclick:()=>{Sound.on?Sound.stopMusic():Sound.startMusic();renderHost()}});
    return el("span",{class:"sound"},[m]);
  }
  function joinUrl(){const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("join",H.code);const s=params.get("server");if(s)u.searchParams.set("server",s);return u.toString()}
  function qrNode(text){const box=el("div",{class:"qr"});try{const q=qrcode(0,"M");q.addData(text);q.make();box.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){box.textContent="QR"}return box}
  function renderHost(){
    if(mode!=="host")return;
    const players=ranked(),online=onlinePids();
    const st=hStatus==="ok"?["جاهز · "+online.size+" متصل",""]:hStatus==="offline"?["لا يوجد إنترنت"," warn"]:["جاري التجهيز…"," warn"];
    const top=el("div",{class:"topbar"},[brand(),el("div",{class:"actions"},[soundControls(),el("span",{class:"pill"+st[1]},[el("span",{class:"live"}),el("span",{text:st[0]})])])]);
    if(H.phase==="lobby"){
      const url=joinUrl();
      const list=el("div",{class:"joined"},players.length?players.map(p=>el("span",{class:"who"+(online.has(p.id)?"":" off"),style:`--tc:${p.color}`},[el("span",{class:"dot"}),el("span",{text:p.name})])):[el("p",{class:"muted",text:"لم ينضم أحد بعد. ستظهر الأسماء هنا مباشرة."})]);
      paint([top,el("div",{class:"card in"},[el("span",{class:"eyebrow",text:"قاعة الانتظار"}),el("h1",{text:"من البخار إلى الذكاء الاصطناعي"}),
        el("div",{class:"join-box"},[qrNode(url),el("div",{style:"display:flex;flex-direction:column;gap:8px;min-width:0"},[
          el("span",{class:"muted",text:"امسحوا الرمز بالجوال، أو افتحوا الرابط واكتبوا رمز اللعبة:"}),el("span",{class:"bigcode",text:H.code}),el("span",{class:"link",text:url})])]),
        el("div",{class:"strip"},STAGES.map((s,i)=>el("figure",{style:"cursor:pointer",title:"اضغط لسماع صوت المرحلة",onclick:()=>Sound.stageFx(i)},[artNode(i),el("figcaption",{text:"🔊 "+s.v+" · "+s.rev})]))),
        el("div",{class:"actions"},[el("span",{class:"count",text:players.length}),el("span",{class:"muted",text:"معلم انضم"})]),list,
        el("div",{class:"actions"},[btn("ابدأ ←",()=>setPhase("play"),"btn big"),
          players.length?btn("مسح القائمة",()=>{H.players={};H.order=[];saveH();renderHost()},"btn ghost small"):null,
          btn("الصفحة الرئيسية",()=>{store.del("t40-role");location.href=location.pathname},"btn ghost small")])])]);
      return;
    }
    if(H.phase==="play"){
      const finished=players.filter(p=>p.done).length;
      const head=el("div",{class:"lane-head"},[el("span",{text:"المعلم"}),el("div",{class:"marks"},STAGES.map(s=>el("span",{text:s.v+" · "+s.short}))),el("span",{text:"نقاط"})]);
      const lanes=el("div",{class:"lanes"},[head,...players.map(p=>{
        const pct=p.done?100:Math.round(p.n/TOTAL*100);
        return el("div",{class:"lane"+(p.done?" done":"")+(online.has(p.id)||p.done?"":" off"),style:`--tc:${p.color}`},[
          el("div",{class:"nm"},[el("span",{class:"dot"}),el("span",{text:p.name})]),
          el("div",{class:"track"},[25,50,75].map(x=>el("span",{class:"seg",style:`inset-inline-start:${x}%`})).concat([
            el("span",{class:"fill",style:`width:${pct}%`}),el("span",{class:"tok",style:`inset-inline-start:calc(${pct}% - ${(pct*0.26).toFixed(1)}px)`})])),
          el("span",{class:"pt",text:p.score})])})]);
      if(!players.length)lanes.append(el("p",{class:"muted",text:"لا يوجد لاعبون بعد."}));
      const board=el("div",{class:"board"},players.slice(0,10).map((p,i)=>el("div",{class:"row"+(i===0&&p.score>0?" first":"")},[el("span",{class:"rk num",text:i+1}),el("span",{class:"nm",text:p.name}),p.arr>=0?el("span",{class:"arr",text:`وصل #${p.arr+1}`}):null,el("span",{class:"pt",text:p.score})])));
      paint([top,el("div",{class:"dash"},[
        el("div",{class:"card"},[el("div",{class:"topbar"},[el("h2",{text:"مسار السباق"}),el("span",{class:"muted",text:`وصل ${finished} من ${players.length} · رمز اللعبة ${H.code}`})]),lanes]),
        el("div",{class:"card"},[el("h2",{text:"الترتيب"}),board,el("div",{class:"actions"},[btn("أنهِ التحدّي وأعلن الفائز",()=>setPhase("over"))])])])]);
      return;
    }
    const [g1,g2,g3]=players;
    const step=(p,cls,medal)=>p?el("div",{class:"step "+cls},[el("span",{class:"medal num",text:medal}),el("span",{class:"nm",text:p.name}),el("span",{class:"muted",html:`<span class="num">${p.score}</span> نقطة`}),p.arr>=0?el("span",{class:"arr",text:`وصل #${p.arr+1}`}):null]):el("div");
    paint([top,el("div",{class:"card in"},[el("span",{class:"eyebrow",text:"نهاية التحدّي"}),
      el("h1",{text:g1?`الفائز: ${g1.name}`:"لا يوجد لاعبون"}),
      el("p",{class:"muted",html:'سُمّيت الورشة «معلم <span class="num">4.0</span>» نسبةً إلى الثورة الصناعية الرابعة والتعليم 4.0: معلم يوظّف الذكاء الاصطناعي ويجعل الطالب صانعًا للمعرفة.'}),
      el("div",{class:"podium"},[step(g2,"g2","2"),step(g1,"g1","1"),step(g3,"g3","3")]),
      el("div",{class:"board"},players.slice(3).map((p,i)=>el("div",{class:"row"},[el("span",{class:"rk num",text:i+4}),el("span",{class:"nm",text:p.name}),el("span",{class:"pt",text:p.score})]))),
      el("div",{class:"actions"},[btn("العودة إلى السباق",()=>setPhase("play"),"btn ghost"),
        btn("جولة جديدة",()=>{H.epoch=rid();H.order=[];Object.values(H.players).forEach(p=>{p.n=0;p.score=0;p.done=false});setPhase("lobby")},"btn ghost")])])]);
  }

  /* ================= landing / boot ================= */
  let mode="landing";
  function landing(){
    mode="landing";
    const codeIn=el("input",{type:"text",id:"lcode",class:"code",inputmode:"numeric",maxlength:"4",placeholder:"0000"});
    paint([el("div",{class:"topbar"},[brand()]),el("div",{class:"card in"},[el("span",{class:"eyebrow",text:"ورشة معلم 4.0"}),el("h1",{text:"من البخار إلى الذكاء الاصطناعي"}),
      el("p",{class:"muted",text:"تحدٍّ من أربع مراحل: كل مرحلة ثورة صناعية غيّرت المدرسة ودور المعلم. من يصل أولًا بأعلى النقاط يكتشف سرّ اسم الورشة ويفوز."})]),
      el("div",{class:"choose"},[
        el("div",{class:"card"},[el("h2",{text:"أنا معلم مشارك"}),el("label",{},[el("span",{text:"رمز اللعبة"}),codeIn]),btn("انضم ←",()=>{const c=codeIn.value.replace(/\D/g,"");if(c.length!==4)return codeIn.focus();P.code=c;saveP();mode="player";renderPlayer()})]),
        el("div",{class:"card"},[el("h2",{text:"أنا المقدّم"}),el("p",{class:"muted",text:"اعرض هذه الشاشة على البروجكتر: يظهر رمز اللعبة وأسماء المنضمين ومسار السباق."}),btn("افتح لوحة المقدّم",()=>{store.set("t40-role","host");mode="host";Sound.startMusic();startHost()},"btn ghost")])])]);
  }
  if(params.get("join")){mode="player";renderPlayer();if(P.name)connectHost()}
  else if(store.get("t40-role",null)==="host"){mode="host";startHost()}
  else if(P.name&&P.code){mode="player";renderPlayer();connectHost()}
  else landing();
})();
</script>
