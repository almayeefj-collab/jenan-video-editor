<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>امسح الباركود لتسجيل الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700;800&family=Mirza:wght@700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }
  :root{ --brown:#5d2200; --brown2:#7a3a1c; --peach:#ec9a63; --muted:#8a5a44; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:210mm;height:297mm}
  .page{
    position:relative;width:210mm;height:297mm;overflow:hidden;
    background:url("sadu-bg.jpg") center/100% 100% no-repeat;
    font-family:'Noto Sans Arabic',sans-serif;color:var(--brown);
  }
  .content{
    position:absolute;top:14mm;left:46mm;right:12mm;height:178mm;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  }
  .logo{width:44mm;height:auto;display:block;mix-blend-mode:multiply}
  .welcome{font-family:'Mirza',serif;font-weight:700;font-size:21mm;line-height:1.35;color:var(--brown);
           -webkit-text-stroke:.45mm var(--brown);paint-order:stroke fill;white-space:nowrap}
  .event{font-weight:800;font-size:7mm;line-height:1.35;color:var(--brown2)}
  .scan{font-weight:800;font-size:9mm;line-height:1.2}
  .scan small{display:block;font-weight:500;font-size:4.6mm;color:var(--muted);margin-top:1mm}
  .qr{position:relative;padding:4.5mm;background:#fffaf6;border-radius:3mm;border:.5mm solid #e7c9b6}
  .qr img{display:block;width:56mm;height:56mm}
  .qb{position:absolute;width:8mm;height:8mm;border:0 solid var(--peach)}
  .q1{top:-1mm;right:-1mm;border-top-width:1.3mm;border-right-width:1.3mm;border-top-right-radius:3.5mm}
  .q2{top:-1mm;left:-1mm;border-top-width:1.3mm;border-left-width:1.3mm;border-top-left-radius:3.5mm}
  .q3{bottom:-1mm;right:-1mm;border-bottom-width:1.3mm;border-right-width:1.3mm;border-bottom-right-radius:3.5mm}
  .q4{bottom:-1mm;left:-1mm;border-bottom-width:1.3mm;border-left-width:1.3mm;border-bottom-left-radius:3.5mm}
</style>
</head>
<body>
<div class="page">
  <div class="content">
    <img class="logo" src="school-logo.png" alt="شعار ثانوية فاطمة الهاشمية">
    <div class="welcome">حيــاكــم اللّــه</div>
    <div class="event">حضور اجتماع مديري ومديرات المدارس</div>
    <div class="scan">امسح الباركود<small>لتسجيل حضورك بالاسم والمدرسة</small></div>
    <div class="qr">
      <img src="qr-brown.svg" alt="باركود صفحة تسجيل الحضور">
      <div class="qb q1"></div><div class="qb q2"></div><div class="qb q3"></div><div class="qb q4"></div>
    </div>
  </div>
</div>
</body>
</html>
