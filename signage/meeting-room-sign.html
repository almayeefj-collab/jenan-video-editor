<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة غرفة الاجتماعات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }
  :root{ --ink:#333335; --ink2:#232325; --orange:#ef7f1a; --muted:#8a8a8e; --line:#e6e6e8; --bg:#ffffff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:210mm;height:297mm;background:var(--bg)}
  .page{
    position:relative;width:210mm;height:297mm;overflow:hidden;background:var(--bg);
    font-family:'Cairo',sans-serif;color:var(--ink);
    display:grid;grid-template-rows:auto 1fr auto;justify-items:center;
    padding:22mm 18mm 20mm;
  }
  /* thin accents */
  .page::before{content:"";position:absolute;top:0;left:0;right:0;height:5mm;background:var(--ink2)}
  .page::after{content:"";position:absolute;top:5mm;left:0;right:0;height:1.2mm;background:var(--orange)}
  .foot-bar{position:absolute;bottom:0;left:0;right:0;height:5mm;background:var(--ink2)}
  .foot-bar::before{content:"";position:absolute;top:-1.2mm;left:0;right:0;height:1.2mm;background:var(--orange)}
  .frame{position:absolute;inset:14mm 12mm;border:.35mm solid var(--line);border-radius:4mm;pointer-events:none}
  .corner{position:absolute;width:12mm;height:12mm;border:0 solid var(--orange)}
  .c1{top:14mm;right:12mm;border-top-width:1mm;border-right-width:1mm;border-top-right-radius:4mm}
  .c2{top:14mm;left:12mm;border-top-width:1mm;border-left-width:1mm;border-top-left-radius:4mm}
  .c3{bottom:14mm;right:12mm;border-bottom-width:1mm;border-right-width:1mm;border-bottom-right-radius:4mm}
  .c4{bottom:14mm;left:12mm;border-bottom-width:1mm;border-left-width:1mm;border-bottom-left-radius:4mm}

  .logo{width:72mm;height:auto;display:block;margin-top:4mm}

  .content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%}
  .welcome{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:44mm;line-height:1.55;color:var(--ink);padding-bottom:2mm;word-spacing:12mm}
  .rule{display:flex;align-items:center;gap:4mm;margin:10mm 0 8mm}
  .rule span{width:30mm;height:.4mm;background:var(--orange);opacity:.55}
  .rule i{width:2.6mm;height:2.6mm;background:var(--orange);transform:rotate(45deg)}
  .to{font-weight:700;font-size:14mm;line-height:1;color:var(--muted)}
  .room{font-weight:800;font-size:19mm;line-height:1.2;color:var(--orange);margin-top:7mm}

  .direction{
    display:flex;align-items:center;justify-content:center;
    width:150mm;height:34mm;border-radius:17mm;background:#7a7b7e;margin-bottom:6mm;
  }
  body.left .direction svg{transform:scaleX(-1)}
</style>
</head>
<body>
<script>if(location.hash==='#left')document.body.classList.add('left')</script>
<div class="page">
  <div class="frame"></div>
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="foot-bar"></div>

  <img class="logo" src="school-logo.png" alt="شعار ثانوية فاطمة الهاشمية">

  <div class="content">
    <div class="welcome">حياكم اللّه</div>
    <div class="rule"><span></span><i></i><span></span></div>
    <div class="to">إلى</div>
    <div class="room">غرفة الاجتماعات</div>
  </div>

  <div class="direction" aria-label="اتجه يمين">
    <svg width="118mm" height="20mm" viewBox="0 0 236 40" xmlns="http://www.w3.org/2000/svg">
      <line x1="6" y1="20" x2="214" y2="20" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M194 4 L224 20 L194 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
</body>
</html>
