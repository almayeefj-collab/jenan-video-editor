<title>كتاب السلطة التنفيذية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a physical golden schoolbook lying on a dark green desk; RTL spread with 3D page-turns. Single look on purpose (the book is an object). */
:root{
  --desk:#0f2a1f; --desk2:#1c4634;
  --paper:#fffaf0; --paper2:#f8eccd; --ink:#2a1e0c; --muted:#6b5531;
  --gold:#f2c14e; --gold-d:#d79a22; --green:#0b7a43; --green-d:#075a31; --red:#c8102e; --navy:#1d3b72;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif; --body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,var(--desk2) 0%,var(--desk) 70%);color:#f6ecd2;font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(16px,2.2vw,22px);margin:0;color:var(--gold)}
header .sub{font-size:13px;color:#cdbf9c}
#pageInfo{font-variant-numeric:tabular-nums;font-size:14px;color:#e8dcbc;white-space:nowrap}
#scene{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:2400px;touch-action:pan-y;min-height:0}
#book{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
#book::before{content:"";position:absolute;inset:auto 4% -26px 4%;height:30px;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);transform:translateZ(-2px)}
.leaf{position:absolute;top:0;left:0;transform-style:preserve-3d;transform-origin:right center;transition:transform 1s cubic-bezier(.35,.05,.2,1),opacity .25s}
.leaf.flipped{transform:rotateY(180deg)}
.leaf.single.flipped{opacity:0;pointer-events:none;transition:transform 1s cubic-bezier(.35,.05,.2,1),opacity .3s .7s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper);color:var(--ink)}
.face.back{transform:rotateY(180deg)}
.face.front{border-radius:3px 10px 10px 3px}
.face.back{border-radius:10px 3px 3px 10px}
/* spine shading */
.face.front::after{content:"";position:absolute;inset:0 0 0 auto;width:9%;background:linear-gradient(90deg,transparent,rgba(90,60,10,.18));pointer-events:none;z-index:5}
.face.back::after{content:"";position:absolute;inset:0 auto 0 0;width:9%;background:linear-gradient(270deg,transparent,rgba(90,60,10,.18));pointer-events:none;z-index:5}
.leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.28));transition:opacity .5s}
.leaf.turning .shade{opacity:1}
.paperback{background:repeating-linear-gradient(0deg,#f6e9c8 0 2px,#f3e3bd 2px 4px)}
/* page chrome modelled on the original book */
.pg{position:absolute;inset:0;display:flex;flex-direction:column;font-size:1em}
.band{height:3.2em;flex:none;background:linear-gradient(180deg,#f7d57c,#f3c75a 55%,#fbe7b1);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--gold-d),#fff3c8,var(--gold-d))}
.band i{position:absolute;bottom:0;width:22%;height:70%;background:rgba(255,255,255,.35);clip-path:polygon(0 100%,0 30%,20% 30%,20% 0,80% 0,80% 30%,100% 30%,100% 100%)}
.band .chap{position:absolute;top:.55em;inset-inline-start:1.1em;font-family:var(--display);font-size:.9em;color:#7a4c06}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.9em 1.5em .4em;scrollbar-width:thin;scrollbar-color:#d9b25a transparent}
.foot{flex:none;height:2.6em;display:flex;align-items:center;justify-content:center}
.num{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe9a6,#e2a72d);color:#5a3a00;font-weight:800;font-size:.85em;box-shadow:0 2px 4px rgba(120,80,0,.35)}
h2.t{font-family:var(--display);font-weight:700;color:var(--red);font-size:1.55em;margin:.1em 0 .45em;text-wrap:balance;line-height:1.3}
h3{font-family:var(--display);font-weight:700;color:var(--navy);font-size:1.08em;margin:.6em 0 .3em}
p{margin:.3em 0;line-height:1.75;font-size:.95em}
.quote{background:#fff3d2;border-inline-start:.3em solid var(--gold-d);padding:.5em .8em;border-radius:.4em;font-weight:700;font-size:.92em;line-height:1.7;margin:.4em 0}
.quote small{display:block;color:var(--muted);font-weight:500;margin-top:.2em}
.hint{font-size:.78em;color:var(--muted);display:flex;gap:.4em;align-items:center}
.hint::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--green);box-shadow:0 0 0 .25em rgba(11,122,67,.2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .5em rgba(11,122,67,0)}}
button{font-family:inherit}
.chipbtn{border:0;border-radius:2em;padding:.38em .9em;font-weight:700;font-size:.85em;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.12),0 2px 6px rgba(120,80,0,.15);transition:transform .15s}
.chipbtn:hover{transform:translateY(-2px)}
.chipbtn[aria-pressed="true"]{background:var(--green);color:#fff}
:focus-visible{outline:3px solid #3aa0ff;outline-offset:2px}
/* cover */
.cover{background:#f3c55c}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .gloss{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:gloss 5s ease-in-out infinite;pointer-events:none}
@keyframes gloss{0%,60%{background-position:120% 0}100%{background-position:-60% 0}}
.cover .open{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);background:var(--green-d);color:#fff;border:0;border-radius:2em;padding:.55em 1.4em;font-weight:800;font-size:1em;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35)}
/* generic interactive bits */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.flipcard{perspective:800px;cursor:pointer;min-height:6.2em;border:0;padding:0;background:none;text-align:inherit}
.flipcard .in{position:relative;width:100%;height:100%;min-height:inherit;transform-style:preserve-3d;transition:transform .6s}
.flipcard.on .in{transform:rotateY(180deg)}
.flipcard .a,.flipcard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:.7em;padding:.5em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.flipcard .a{background:linear-gradient(160deg,#fff,#fbefcf);border:2px solid #efd18a;font-family:var(--display);font-weight:700;font-size:1em;color:var(--green-d)}
.flipcard .a small{font-family:var(--body);font-size:.7em;color:var(--muted);font-weight:500;margin-top:.2em}
.flipcard .b{transform:rotateY(180deg);background:var(--green);color:#fff;font-size:.8em;line-height:1.5}
.steps{list-style:none;margin:.3em 0;padding:0;display:grid;gap:.4em}
.steps li{display:grid;grid-template-columns:2em 1fr;gap:.5em;align-items:start;font-size:.88em;line-height:1.6;background:#fff;border-radius:.6em;padding:.45em .6em;box-shadow:0 1px 4px rgba(120,80,0,.12);opacity:.35;transform:translateX(-.6em);transition:.4s}
.steps li.show{opacity:1;transform:none}
.steps li b.n{width:1.8em;height:1.8em;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#5a3a00}
.tabs{display:flex;gap:.35em;flex-wrap:wrap;margin:.3em 0 .5em}
.panel{background:#fff;border-radius:.7em;padding:.6em .8em;box-shadow:0 1px 6px rgba(120,80,0,.15);font-size:.92em;animation:fadeup .4s}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}
.three{width:100%;border-radius:.7em;overflow:hidden;background:linear-gradient(#bfe3f7,#f8e7c0);position:relative;cursor:grab;touch-action:none}
.three canvas{display:block;width:100%!important;height:100%!important}
.three .lbl{position:absolute;bottom:.4em;inset-inline-end:.5em;font-size:.72em;background:rgba(255,255,255,.8);border-radius:1em;padding:.15em .6em;color:var(--ink);pointer-events:none}
.photo{border:.3em solid #fff;border-radius:.4em;box-shadow:0 4px 12px rgba(80,50,0,.3);display:block}
figure{margin:0}
figcaption{font-size:.72em;color:var(--muted);text-align:center;margin-top:.25em}
/* timeline */
.tl{display:flex;justify-content:space-between;position:relative;margin:.5em 0 .4em}
.tl::before{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold-d),var(--green));transform:translateY(-50%)}
.tl button{position:relative;z-index:1;border:0;background:#fff;border-radius:2em;padding:.3em .55em;font-weight:800;font-size:.8em;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.tl button[aria-pressed="true"]{background:var(--red);color:#fff;transform:scale(1.12)}
/* org chart */
.org{display:grid;gap:.6em;justify-items:center;margin-top:.4em}
.org .row{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}
.org button{border:0;border-radius:.7em;padding:.55em .9em;font-family:var(--display);font-weight:700;font-size:.95em;cursor:pointer;background:#fff;color:var(--green-d);box-shadow:0 3px 0 var(--green),0 4px 10px rgba(0,0,0,.12)}
.org button.emir{box-shadow:0 3px 0 var(--gold-d),0 4px 10px rgba(0,0,0,.12);color:#7a4c06}
.org button[aria-pressed="true"]{background:var(--green);color:#fff}
.org .ln{width:3px;height:.9em;background:var(--gold-d)}
/* carousel */
.ring-wrap{height:11em;perspective:700px;position:relative;touch-action:none;cursor:grab;margin:.2em 0}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.mcard{position:absolute;width:6.2em;height:8.2em;margin:-4.1em 0 0 -3.1em;border-radius:.8em;background:linear-gradient(170deg,#fff,#fdf0cf);border:2px solid #f0cf7f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;padding:.4em;text-align:center;backface-visibility:hidden;box-shadow:0 6px 14px rgba(80,50,0,.25)}
.mcard svg{width:2.4em;height:2.4em}
.mcard b{font-family:var(--display);font-size:.82em;color:var(--green-d);line-height:1.3}
.mcard span{font-size:.62em;color:var(--muted);line-height:1.4}
/* seats */
.seats svg{width:100%;height:auto;display:block}
/* sorting game */
.items{display:flex;flex-wrap:wrap;gap:.35em;margin:.3em 0}
.items button{border:2px dashed #d9b25a;background:#fff;border-radius:.6em;padding:.3em .55em;font-size:.8em;cursor:pointer;font-weight:600}
.items button.sel{border-style:solid;border-color:var(--navy);background:#e6eefc}
.items button.ok{display:none}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.bin{border:0;border-radius:.7em;min-height:6.5em;padding:.4em;background:#fff;box-shadow:inset 0 0 0 2px #efd18a;cursor:pointer;display:flex;flex-direction:column;gap:.25em;align-items:stretch;text-align:center}
.bin h4{margin:0;font-family:var(--display);font-size:.9em;color:var(--navy)}
.bin .got{font-size:.68em;background:#e5f4ea;color:var(--green-d);border-radius:.4em;padding:.15em .3em;animation:fadeup .3s}
.bin.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toast{font-size:.82em;font-weight:700;min-height:1.5em;color:var(--green-d)}
/* quiz */
.qcard{background:#fff;border-radius:.8em;padding:.7em .9em;box-shadow:0 2px 10px rgba(120,80,0,.15)}
.qmeta{display:flex;justify-content:space-between;font-size:.78em;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar{height:.35em;background:#f1e3bf;border-radius:1em;overflow:hidden;margin:.3em 0 .5em}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .4s}
.qq{font-weight:800;font-size:1em;line-height:1.6;margin:.2em 0 .5em}
.opts{display:grid;gap:.35em}
.opts button{text-align:start;border:2px solid #efd18a;background:#fffaf0;border-radius:.6em;padding:.45em .7em;font-size:.88em;cursor:pointer;font-weight:600}
.opts button.right{background:#dff3e6;border-color:var(--green)}
.opts button.wrong{background:#fde2e4;border-color:var(--red)}
.opts button:disabled{cursor:default}
.why{font-size:.8em;margin-top:.45em;color:var(--ink);background:#fff6dc;border-radius:.5em;padding:.4em .6em}
.big{font-family:var(--display);font-size:2.6em;color:var(--green-d);text-align:center;margin:.2em 0}
.medal{width:6em;height:6em;margin:.3em auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff2b8,#e0a22a 70%);box-shadow:0 6px 16px rgba(120,80,0,.4),inset 0 0 0 .35em rgba(255,255,255,.45);font-family:var(--display);font-size:1.4em;color:#6b4200}
.primary{border:0;border-radius:2em;padding:.5em 1.2em;font-weight:800;cursor:pointer;background:var(--green);color:#fff;font-size:.9em}
/* toc */
.toc{list-style:none;padding:0;margin:.3em 0;display:grid;gap:.15em}
.toc button{width:100%;display:flex;justify-content:space-between;border:0;background:none;border-bottom:1px dotted #d9b25a;padding:.35em .2em;font-size:.9em;cursor:pointer;color:var(--ink);font-weight:600}
.toc button:hover{color:var(--red)}
.toc span{font-variant-numeric:tabular-nums;color:var(--muted)}
video{width:100%;border-radius:.6em;display:block;background:#000;box-shadow:0 6px 16px rgba(0,0,0,.3)}
/* nav */
nav{display:flex;align-items:center;gap:10px;padding-block:6px max(10px,env(safe-area-inset-bottom,0px))}
nav button{border:0;border-radius:2em;padding:9px 18px;font-weight:800;font-size:14px;cursor:pointer;background:var(--gold);color:#4a2f00;box-shadow:0 3px 0 #a87313}
nav button:disabled{opacity:.35;cursor:default}
nav #sound{background:#24543f;color:#f6ecd2;box-shadow:0 3px 0 #0b2a1d;padding:9px 12px}
.corner{position:absolute;bottom:0;width:3.2em;height:3.2em;z-index:7;border:0;padding:0;cursor:pointer;background:none}
.corner::before{content:"";position:absolute;inset:0;transition:.25s}
.front .corner{left:0}
.front .corner::before{background:linear-gradient(45deg,transparent 50%,rgba(0,0,0,.0) 50%)}
.front .corner:hover::before{background:linear-gradient(45deg,#e9d39a 0 48%,rgba(0,0,0,.18) 50%,transparent 52%)}
.back .corner{right:0}
.back .corner:hover::before{background:linear-gradient(-45deg,#e9d39a 0 48%,rgba(0,0,0,.18) 50%,transparent 52%)}
@media (prefers-reduced-motion:reduce){.leaf,#book{transition-duration:.01s!important}.cover .gloss,.hint::before{animation:none}}
</style>

<div id="app">
  <header>
    <div><h1>الدستور وحقوق الإنسان · السلطة التنفيذية</h1><div class="sub">كتاب تفاعلي · الصف الثاني عشر</div></div>
    <div id="pageInfo" aria-live="polite"></div>
  </header>
  <div id="scene"><div id="book" aria-label="الكتاب"></div></div>
  <nav>
    <button id="prev" type="button">→ السابقة</button>
    <button id="sound" type="button" aria-pressed="true" title="صوت تقليب الصفحات">صوت: تشغيل</button>
    <button id="next" type="button">التالية ←</button>
  </nav>
</div>

<div id="pages" hidden>

<template data-title="الغلاف"><div class="pg cover"><img src="assets/cover.jpg" alt="غلاف كتاب الدستور وحقوق الإنسان للصف الثاني عشر"><div class="gloss"></div><button class="open" data-go="next" type="button">افتح الكتاب</button></div></template>

<template data-title="المحتوى"><div class="pg"><div class="band"><i style="left:8%"></i><i style="left:60%"></i></div><div class="body">
  <h2 class="t">المحتوى</h2>

<template data-title="فيديو تعريفي"><div class="pg"><div class="band"><span class="chap">مدخل</span></div><div class="body">
  <h2 class="t">فيديو تعريفي: مفهوم السلطة التنفيذية</h2>
  <video controls playsinline preload="metadata" poster="assets/poster.jpg" src="assets/intro.mp4"></video>
  <p>شاهد الفيديو، ثم أجب في ذهنك:</p>
  <div class="quote">لماذا لم تعد جهود الأفراد كافية لتقديم الخدمات، وأصبحت الدولة تحتاج إلى سلطة تنفيذية؟</div>
  <button class="chipbtn" data-reveal="ans-v" type="button">اكشف الإجابة</button>
  <p id="ans-v" hidden>لأن الدولة تطورت وزاد عدد سكانها وكثرت مسؤولياتها، فلم تعد قدرات الأفراد كافية لرعاية مصالح المجتمع وحاجاته.</p>
</div><div class="foot"><span class="num">٢</span></div></div></template>

<template data-title="علم الكويت"><div class="pg"><div class="band"><span class="chap">رموز الوطن</span></div><div class="body">
  <h2 class="t">علم دولة الكويت</h2>
  <div class="three" id="flag3d" style="height:12.5em"><span class="lbl">اسحب لتدوير العلم</span></div>
  <p class="hint">اضغط على لون لتعرف معناه</p>
  <div class="tabs" id="flagTabs">
    <button class="chipbtn" data-c="g" type="button" style="border-inline-start:.6em solid #0b7a43">الأخضر</button>
    <button class="chipbtn" data-c="w" type="button" style="border-inline-start:.6em solid #ddd">الأبيض</button>
    <button class="chipbtn" data-c="r" type="button" style="border-inline-start:.6em solid #c8102e">الأحمر</button>
    <button class="chipbtn" data-c="b" type="button" style="border-inline-start:.6em solid #111">الأسود</button>
  </div>
  <div class="panel" id="flagText">رُفع علم الكويت رسمياً عام ١٩٦١م بعد الاستقلال، وألوانه مستوحاة من بيت الشاعر صفي الدين الحلي: «بيضٌ صنائعنا، سودٌ وقائعنا، خضرٌ مرابعنا، حمرٌ مواضينا».</div>
</div><div class="foot"><span class="num">٣</span></div></div></template>

<template data-title="الشيخ عبدالله السالم"><div class="pg"><div class="band"><span class="chap">أبو الدستور</span></div><div class="body">
  <h2 class="t">الشيخ عبدالله السالم الصباح</h2>
  <div style="display:grid;grid-template-columns:38% 1fr;gap:.8em;align-items:start">
    <figure><img class="photo" src="assets/abdullah.jpg" alt="صورة الشيخ عبدالله السالم الصباح" style="width:100%;filter:sepia(.3)"><figcaption>حاكم الكويت ١٩٥٠–١٩٦٥م</figcaption></figure>
    <div><p>في عهده نالت الكويت استقلالها، وصدر <b>الدستور الكويتي</b> الذي أنشأ السلطات العامة الثلاث، لذلك يُلقَّب بـ«أبو الدستور».</p></div>
  </div>
  <p class="hint">تنقّل بين محطات الخط الزمني</p>
  <div class="tl" id="tl">
    <button type="button" data-y="0">١٩٥٠</button><button type="button" data-y="1">١٩٦١</button><button type="button" data-y="2">١٩٦١</button><button type="button" data-y="3">١٩٦٢</button><button type="button" data-y="4">١٩٦٣</button>
  </div>
  <div class="panel" id="tlText"></div>
</div><div class="foot"><span class="num">٤</span></div></div></template>

<template data-title="السلطات العامة الثلاث"><div class="pg"><div class="band"><span class="chap">السلطات العامة</span></div><div class="body">
  <h2 class="t">السلطات العامة في النظام الدستوري الكويتي</h2>
  <p>لم يكن النظام الدستوري في الكويت نتاج عصره الحاضر فقط؛ فقد كان الحاكم يتشاور ويستمع لأفراد المجتمع. ومع تطور الدولة أنشأ الدستور <b>ثلاث سلطات عامة</b> وحدد وظائفها وعلاقة كلٍّ منها بالأخرى.</p>
  <p class="hint">اقلب كل بطاقة لتعرف وظيفتها</p>

<template data-title="الغلاف الخلفي"><div class="pg cover"><img src="assets/back.jpg" alt="الغلاف الخلفي للكتاب"></div></template>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const AR=(n)=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const tpls=[...document.querySelectorAll('#pages template')];
const N=tpls.length;
const book=document.getElementById('book'), scene=document.getElementById('scene');
let mode=null, leaves=[], k=0, pw=0, ph=0, busy=false, soundOn=true, actx=null;
const ctrls={}; // page index -> {start,stop}

/* ---------- sound ---------- */
function flipSound(){ if(!soundOn) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const len=actx.sampleRate*.35, b=actx.createBuffer(1,len,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++){const t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,2)*(t<.08?t/.08:1)*.5;}
  const s=actx.createBufferSource(); s.buffer=b; const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=.6;
  s.connect(f); f.connect(actx.destination); s.start(); }catch(e){} }

/* ---------- build ---------- */
function makePage(i){ const w=document.createElement('div'); w.style.position='absolute'; w.style.inset='0'; w.appendChild(tpls[i].content.cloneNode(true)); w.dataset.page=i; return w; }
function corner(dir){ const c=document.createElement('button'); c.className='corner'; c.type='button'; c.setAttribute('aria-label',dir==='next'?'الصفحة التالية':'الصفحة السابقة'); c.dataset.go=dir; return c; }
function build(){
  Object.values(ctrls).forEach(c=>c.stop&&c.stop());
  const newMode = innerWidth>=860 ? 'spread' : 'single';
  const pageIdx = currentPages()[0] ?? 0;
  mode=newMode; book.innerHTML=''; leaves=[];
  const count = mode==='spread' ? Math.ceil(N/2) : N;
  for(let i=0;i<count;i++){
    const leaf=document.createElement('div'); leaf.className='leaf'+(mode==='single'?' single':'');
    const f=document.createElement('div'); f.className='face front';
    const b=document.createElement('div'); b.className='face back';
    if(mode==='spread'){ f.appendChild(makePage(2*i)); if(2*i+1<N) b.appendChild(makePage(2*i+1)); else b.classList.add('paperback'); }
    else { f.appendChild(makePage(i)); b.classList.add('paperback'); }
    if(!(mode==='spread'&&i===0) && !(mode==='single'&&i===0)) f.appendChild(corner('next'));
    if(mode==='spread' && 2*i+1<N-1) b.appendChild(corner('prev'));
    const sh=document.createElement('div'); sh.className='shade';
    leaf.append(f,b,sh); book.appendChild(leaf); leaves.push(leaf);
  }
  initPages();
  layout(); setK(mode==='spread'? (pageIdx%2? (pageIdx+1)/2 : pageIdx/2) : pageIdx, true);
}
function layout(){

  function frame(){ raf=requestAnimationFrame(frame); const em=parseFloat(getComputedStyle(wrap).fontSize); ring.style.setProperty('--rz',(em*6.2*n/(2*Math.PI)*1.04)+'px'); if(auto) a-=.15; ring.style.transform=`translateZ(${-(em*6.2*n/(2*Math.PI))}px) rotateX(-6deg) rotateY(${a}deg)`; }
  wrap.addEventListener('pointerdown',e=>{drag=e.clientX;auto=false;wrap.setPointerCapture(e.pointerId);e.stopPropagation();});
  wrap.addEventListener('pointermove',e=>{ if(drag===null) return; a+=(e.clientX-drag)*.4; drag=e.clientX; });
  wrap.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>auto=true,2500);});
  ctrls[pageOf(ring)]={start(){ if(!raf) frame(); },stop(){ if(raf){cancelAnimationFrame(raf);raf=null;} }}; }
/* candidates */
const CANDS=[{n:'خالد، ٣٤ سنة، كويتي بصفة أصلية، يجيد القراءة والكتابة بالعربية',ok:true,why:'تتوافر فيه كل الشروط.'},{n:'سارة، ٢٧ سنة، كويتية بصفة أصلية، تجيد العربية',ok:false,why:'عمرها أقل من ثلاثين سنة ميلادية.'},{n:'فهد، ٤٥ سنة، حصل على الجنسية حديثاً (ليست أصلية)',ok:false,why:'يشترط أن يكون كويتياً بصفة أصلية.'}];
function candidates(){ const box=Q('cands'); if(!box) return;

  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const c=CANDS[b.dataset.i], right=(b.dataset.v==='1')===c.ok; const t=b.parentNode.querySelector('.toast'); t.style.color=right?'#075a31':'#c8102e'; t.textContent=(right?'صحيح! ':'راجع الشروط: ')+c.why; }); }
/* cabinet */
function cabinet(){ const box=Q('cabinet'); if(!box) return; const n=16; const att=new Array(n).fill(false); [0,1,2,3,4,5,6].forEach(i=>att[i]=true);
  box.innerHTML=Array.from({length:n},(_,i)=>`<button type="button" aria-label="مقعد ${i===0?'رئيس الوزراء':'وزير '+(i)}" data-i="${i}" style="aspect-ratio:1;border:0;border-radius:.5em;cursor:pointer;font-size:.6em;font-weight:800"></button>`).join('');
  const bs=[...box.children];
  const paint=()=>{ bs.forEach((b,i)=>{ b.style.background=att[i]?(i===0?'#7a4c06':'#0b7a43'):'#eadfc6'; b.style.color=att[i]?'#fff':'#9a8763'; b.textContent=i===0?'رئيس':AR(i); });
    const c=att.filter(Boolean).length, ok=c>n/2; Q('cabTxt').innerHTML=`الحضور: <b>${AR(c)}</b> من ${AR(n)} — ${ok?'<span style="color:#075a31">الجلسة صحيحة (أكثر من النصف)</span>':'<span style="color:#c8102e">الجلسة غير صحيحة، لم يحضر أكثر من النصف</span>'}`; };
  bs.forEach((b,i)=>b.onclick=()=>{ att[i]=!att[i]; paint(); });
  Q('allBtn').onclick=()=>{ att.fill(true); paint(); };
  Q('voteBtn').onclick=()=>{ const c=att.filter(Boolean).length; if(c<=n/2){ Q('cabTxt').innerHTML='<span style="color:#c8102e">لا يمكن التصويت: الجلسة غير صحيحة.</span>'; return; }
    const yes=Math.floor(c/2)+1+Math.floor(Math.random()*(c-Math.floor(c/2)-1)); const no=c-yes;
    Q('cabTxt').innerHTML=`نتيجة التصويت: موافق <b>${AR(yes)}</b> · معارض <b>${AR(no)}</b> ← صدر القرار بأغلبية الحاضرين. ${no?`وعلى الوزراء المعارضين (${AR(no)}) الالتزام به تطبيقاً لمبدأ التضامن الوزاري، أو الاستقالة.`:''}`; };
  paint(); }
/* sorter */
const SORT=[['رسم التفصيلات اللازمة لتنفيذ القوانين','adm'],['إنشاء القطاعات الحكومية وتنظيمها','adm'],['لوائح لحماية أمن المواطن وصحته وبيئته','adm'],['حل مجلس الأمة وتأجيل جلساته','pol'],['إبرام المعاهدات والاتفاقيات الدولية','pol'],['افتتاح سفارات الكويت في الخارج','pol'],['العفو عن العقوبة أو تخفيضها','jud']];
function sorter(){ const box=Q('sortItems'); if(!box) return; let sel=null, done=0;
  const order=SORT.map((s,i)=>i).sort(()=>Math.random()-.5);
  box.innerHTML=order.map(i=>`<button type="button" data-i="${i}">${SORT[i][0]}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ box.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  book.querySelectorAll('#bins .bin').forEach(bin=>bin.onclick=()=>{ if(!sel){ Q('sortToast').textContent='اختر بطاقة أولاً.'; return; }
    const it=SORT[sel.dataset.i]; if(it[1]===bin.dataset.b){ const g=document.createElement('div'); g.className='got'; g.textContent=it[0]; bin.appendChild(g); sel.classList.add('ok'); sel=null; done++;
      Q('sortToast').style.color='#075a31'; Q('sortToast').textContent= done===SORT.length?'ممتاز! صنّفت جميع الاختصاصات بشكل صحيح.':'إجابة صحيحة!'; }
    else { bin.classList.remove('bad'); void bin.offsetWidth; bin.classList.add('bad'); Q('sortToast').style.color='#c8102e'; Q('sortToast').textContent='حاول مرة أخرى.'; } }); }
/* exceptional */

 `<p>عهد الدستور إلى السلطة التشريعية بإصدار القوانين، لكنه أجاز للسلطة التنفيذية إصدار <b>مراسيم لها قوة القانون</b> في حالتين:</p>

  <p>الكويت دولة محبة للسلام. وطبّقت الدفاع عن الأشقاء العرب فعلياً في حربي <b>١٩٦٧م</b> و<b>١٩٧٣م</b>.</p>`,
 `<p>الأحكام العرفية نظم توضع لمواجهة خطر يتعرض له الدولة، طبيعي كالزلازل، أو سياسي واجتماعي كالاضطرابات والحروب. صدر قانونها عام <b>١٩٦٧م</b>، وتُعلن بمرسوم في الحالات الآتية:</p>
  <p>تعرّض الأمن والنظام العام للخطر · وقوع عدوان مسلح · إذا أوشك عدوان على الوقوع · حدوث اضطرابات داخلية · حاجة القوات المسلحة لتأمين سلامتها وطرق مواصلاتها.</p>
  <p><b>أُعلنت مرتين</b>: عام ١٩٦٧م، وعام ١٩٩١م بعد تحرير الكويت من الغزو العراقي لمدة ثلاثة أشهر.</p>`];

/* quiz */
const QZ=[
 ['السلطة التنفيذية هي الجهة التي:',['تصدر القوانين','تنفّذ ما يصدر عن السلطة التشريعية من قوانين','تفصل في المنازعات بين الأفراد','تنتخب أعضاء مجلس الأمة'],1,'هذا هو تعريف السلطة التنفيذية في الكتاب.'],
 ['وفق المادة (٥٢) يتولى السلطة التنفيذية:',['الأمير ومجلس الأمة','مجلس الأمة والمحاكم','الأمير ومجلس الوزراء والوزراء','رئيس الوزراء وحده'],2,'«السلطة التنفيذية يتولاها الأمير ومجلس الوزراء والوزراء».'],
 ['المادة التي تنص على أن «الأمير رئيس الدولة، وذاته مصونة لا تمس» هي:',['المادة ٤','المادة ٥٤','المادة ١٢٣','المادة ٦٨'],1,'المادة ٥٤، ويعني ذلك عدم جواز مساءلته عن أعماله.'],
 ['يجب على الأمير الجديد تعيين ولي العهد خلال:',['ثمانية أيام','ثلاثة أشهر','سنة على الأكثر','خمس سنوات'],2,'يستلزم الدستور تعيين ولي العهد خلال سنة على الأكثر من تاريخ تولي الأمير منصبه.'],
 ['في الأسلوب غير العادي يجب أن يتم اختيار الأمير خلال:',['ثمانية أيام','شهر','سنة','ثلاثين يوماً'],0,'حتى لا تطول فترة بقاء مسند الإمارة خالياً.'],
 ['إذا كان عدد أعضاء مجلس الأمة المنتخبين ٥٠ عضواً فإن الحد الأقصى لعدد الوزراء:',['١٠ وزراء','١٦ وزيراً','٢٥ وزيراً','٥٠ وزيراً'],1,'لا يتجاوز عدد الوزراء ثلث الأعضاء المنتخبين، أي ١٦ وزيراً بمن فيهم رئيس الوزراء.'],
 ['من شروط تولي المنصب الوزاري ألا يقل العمر يوم التعيين عن:',['٢١ سنة','٢٥ سنة','٣٠ سنة','٤٠ سنة'],2,'إضافة إلى أن يكون كويتياً بصفة أصلية ويجيد القراءة والكتابة بالعربية.'],
 ['يُشترط لصحة اجتماع مجلس الوزراء حضور:',['ثلث الوزراء','نصف الوزراء','أكثر من نصف الوزراء','جميع الوزراء'],2,'وتصدر القرارات بأغلبية أصوات الحاضرين.'],
 ['العفو عن العقوبة أو تخفيضها من الاختصاصات:',['الإدارية','السياسية','القضائية','التشريعية'],2,'يصدر الأمير مرسوماً أميرياً بالعفو أو التخفيض.'],
 ['من الاختصاصات السياسية في جانبها الدولي:',['إصدار اللوائح','إبرام المعاهدات والاتفاقيات الدولية','العفو عن العقوبة','إنشاء القطاعات الحكومية'],1,'ومنها أيضاً إقامة العلاقات الدولية وافتتاح السفارات.'],
 ['أُعلنت الأحكام العرفية في تاريخ الكويت الحديث عامي:',['١٩٦١ و١٩٦٢','١٩٦٧ و١٩٩١','١٩٧٣ و١٩٩٠','١٩٨٢ و٢٠٠٣'],1,'عام ١٩٦٧م، وعام ١٩٩١م بعد التحرير لمدة ثلاثة أشهر.'],
 ['حسب المادة (٦٨) من الدستور فإن الحرب الهجومية:',['تُعلن بمرسوم','تُعلن بقانون','محرّمة','يقررها مجلس الوزراء'],2,'يعلن الأمير الحرب الدفاعية بمرسوم، أما الحرب الهجومية فمحرمة.']];
function quiz(){ const box=Q('quiz'); if(!box) return; let i=0, score=0;
  const show=()=>{ if(i>=QZ.length) return finish(); const [q,opts,ans,why]=QZ[i];
    box.innerHTML=`<div class="qmeta"><span>السؤال ${AR(i+1)} من ${AR(QZ.length)}</span><span>النقاط: ${AR(score)}</span></div><div class="qbar"><i style="width:${i/QZ.length*100}%"></i></div><div class="qq">${q}</div><div class="opts">${opts.map((o,j)=>`<button type="button" data-j="${j}">${o}</button>`).join('')}</div><div id="qwhy"></div>`;
    box.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; box.querySelectorAll('.opts button').forEach((x,xi)=>{ x.disabled=true; if(xi===ans) x.classList.add('right'); });
      if(j===ans) score++; else b.classList.add('wrong');
      box.querySelector('#qwhy').innerHTML=`<div class="why"><b>${j===ans?'أحسنت!':'الإجابة الصحيحة موضحة باللون الأخضر.'}</b> ${why}</div><button class="primary" type="button" style="margin-top:.5em">${i===QZ.length-1?'عرض النتيجة':'السؤال التالي'}</button>`;
      box.querySelector('#qwhy .primary').onclick=()=>{ i++; show(); }; }); };

    box.innerHTML=`<div class="medal">${AR(score)} / ${AR(QZ.length)}</div><div class="big" style="font-size:1.6em">${msg}</div><div style="display:flex;gap:.5em;justify-content:center;flex-wrap:wrap"><button class="primary" type="button" id="qAgain">أعد الاختبار</button><button class="chipbtn" type="button" data-go="next">الخلاصة</button></div>`;
