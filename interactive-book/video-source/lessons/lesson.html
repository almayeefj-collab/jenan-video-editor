<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(Cairo.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:540px;overflow:hidden;font-family:Cairo,sans-serif;color:#2b1d07}
#st{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 70% 25%,#fff3c9 0%,#f6d27a 50%,#d99a2b 100%)}
#pat{position:absolute;inset:-40px;opacity:.12;background-image:repeating-linear-gradient(45deg,#7a4b00 0 2px,transparent 2px 40px),repeating-linear-gradient(-45deg,#7a4b00 0 2px,transparent 2px 40px)}
.sc{position:absolute;inset:0;opacity:0;padding:70px 70px 50px}
.t{opacity:0}
.tag{display:inline-block;background:#06512c;color:#fff;padding:4px 20px;border-radius:30px;font-size:22px;font-weight:700}
h1{font-size:64px;font-weight:900;color:#06512c;line-height:1.25;text-shadow:0 3px 0 rgba(255,255,255,.6)}
h2{font-size:40px;font-weight:800;color:#06512c;margin-bottom:22px}
.li{display:flex;gap:16px;align-items:center;background:rgba(255,250,235,.93);border-radius:16px;padding:10px 20px;margin-bottom:12px;font-size:27px;font-weight:700;box-shadow:0 8px 20px rgba(80,45,0,.2)}
.li b{flex:none;width:40px;height:40px;border-radius:50%;background:#c8102e;color:#fff;display:grid;place-items:center;font-size:22px}
.q{background:rgba(255,250,235,.95);border-right:12px solid #c8102e;border-radius:18px;padding:30px 36px;font-size:36px;font-weight:800;line-height:1.6;box-shadow:0 14px 34px rgba(80,45,0,.3)}
.src{margin-top:16px;font-size:26px;font-weight:700;color:#06512c}
.cards{display:grid;gap:18px}
.card{background:#fff;border-radius:20px;padding:26px 16px;text-align:center;box-shadow:0 12px 28px rgba(80,45,0,.25);border-bottom:8px solid #0b7a43}
.card b{display:block;font-size:34px;color:#06512c}
.card span{font-size:22px;font-weight:600}
.photo{border:7px solid #fff;border-radius:16px;box-shadow:0 18px 40px rgba(60,30,0,.4);object-fit:cover}
#bar{position:absolute;bottom:0;right:0;height:7px;background:linear-gradient(90deg,#c8102e,#fff,#0b7a43)}
#brand{position:absolute;top:16px;left:24px;font-size:17px;font-weight:700;color:rgba(60,35,0,.7)}
#pg{position:absolute;top:16px;right:24px;font-size:17px;font-weight:700;color:rgba(60,35,0,.7)}
</style></head><body><div id="st"><div id="pat"></div><div id="brand">الدستور وحقوق الإنسان · الصف الثاني عشر</div><div id="pg"></div><div id="root"></div><div id="bar"></div></div>
<script>
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function flagCanvas(id){ return `<canvas id="${id}" width="520" height="340" style="position:absolute;left:60px;top:120px"></canvas>`; }
function drawFlag(cv,t){ const c=cv.getContext('2d'); c.clearRect(0,0,520,340); const W=400,H=200,ox=40,oy=50,cols=80,cw=W/cols;
  c.fillStyle='#6b4a1a'; c.fillRect(ox-12,oy-20,10,300);
  for(let i=0;i<cols;i++){ const u=i/cols, ph=u*7-t*4, dy=Math.sin(ph)*u*16, x=ox+i*cw, y0=oy+dy, sh=Math.cos(ph)*u*.35;
    const s=(col,a,b)=>{c.fillStyle=col;c.fillRect(x,y0+a*H,cw+1,(b-a)*H)}; s('#0b7a43',0,1/3); s('#fff',1/3,2/3); s('#ce1126',2/3,1);
    if(i*cw<W/4){ const f=i*cw/(W/4); c.fillStyle='#111'; c.fillRect(x,y0+f*H/3,cw+1,H-2*f*H/3); }
    c.fillStyle=sh>0?`rgba(255,255,255,${sh*.5})`:`rgba(0,0,0,${-sh*.6})`; c.fillRect(x,y0,cw+1,H); } }
window.setup=function(S){
  const root=document.getElementById('root'); let html='', t=0; const sc=[];
  const add=(inner,d)=>{ sc.push({a:t,b:t+d}); html+=`<div class="sc" data-a="${t}" data-b="${t+d}">${inner}</div>`; t+=d; };
  add(`<div style="position:absolute;right:70px;top:150px;width:820px"><span class="tag t" data-in=".3">${S.tag}</span><h1 class="t" data-in=".8" style="margin-top:18px">${S.title}</h1><p class="t" data-in="1.6" style="font-size:26px;font-weight:700;color:#5a3a00;margin-top:10px">شرح الدرس</p></div>`,4);
  for(const s of S.scenes){
    if(s.type==='points'){ const its=s.items.map((x,i)=>`<div class="li t" data-in="${.9+i*1.1}"><b>${'١٢٣٤٥٦'[i]}</b><span>${x}</span></div>`).join('');
      add(`<h2 class="t" data-in=".2">${s.h}</h2>${its}`, 2.6+s.items.length*1.5); }
    else if(s.type==='quote'){ add(`<div style="margin-top:60px"><div class="q t" data-in=".3">«${s.q}»</div><div class="src t" data-in="1.4">${s.src}</div></div>`, 3.5+s.q.length/22); }
    else if(s.type==='image'){ const img=s.img==='flag'?flagCanvas('fc'):`<img class="photo t" data-in=".2" src="${s.img}.jpg" style="position:absolute;left:70px;top:90px;width:${s.img==='abdullah'?300:420}px;height:${s.img==='abdullah'?380:300}px">`;
      add(`${img}<div style="position:absolute;right:70px;top:150px;width:380px"><h2 class="t" data-in=".6">${s.h}</h2><p class="t" data-in="1.5" style="font-size:28px;font-weight:700;line-height:1.6">${s.text}</p></div>`,6); }
    else if(s.type==='three'){ const cs=s.items.map((x,i)=>{const [a,b]=x.split('|');return `<div class="card t" data-in="${.8+i*.9}"><b>${a}</b><span>${b}</span></div>`}).join('');
      add(`<h2 class="t" data-in=".2">${s.h}</h2><div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:40px">${cs}</div>`,6.5); }
    else if(s.type==='grid'){ const cs=s.items.map((x,i)=>`<div class="card t" data-in="${.8+i*.6}" style="padding:20px 10px"><b style="font-size:30px">${x}</b></div>`).join('');
      add(`<h2 class="t" data-in=".2">${s.h}</h2><div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:20px">${cs}</div>`,3+s.items.length*.7); }
    else if(s.type==='tree'){ const cs=s.items.map((x,i)=>{const [a,b]=x.split('|');return `<div class="card t" data-in="${1.6+i*1}"><b>${a}</b><span>${b}</span></div>`}).join('');
      add(`<h2 class="t" data-in=".2">${s.h}</h2><div class="card t" data-in=".8" style="width:360px;margin:0 auto 30px;border-bottom-color:#e7a42b"><b>${s.root}</b></div><div class="cards" style="grid-template-columns:1fr 1fr">${cs}</div>`,6.5); }
    else if(s.type==='title2'){ add(`<div style="margin-top:110px;text-align:center"><h2 class="t" data-in=".3" style="font-size:48px">${s.h}</h2><p class="t" data-in="1.2" style="font-size:32px;font-weight:700;line-height:1.6">${s.text}</p></div>`,5); }
  }
  add(`<div style="margin-top:120px;text-align:center"><h1 class="t" data-in=".3" style="font-size:52px">الآن جرّب أنشطة الصفحة</h1><p class="t" data-in="1" style="font-size:26px;font-weight:700">قلّب البطاقات · اضغط على العناصر · ثم اختبر نفسك</p></div>`,3.5);
  root.innerHTML=html; window.DUR=t; window.scenes=[...root.children];
};
window.render=function(t){
  for(const s of scenes){ const a=+s.dataset.a,b=+s.dataset.b,lt=t-a, vis=t>=a-.01&&t<b+.5;
    s.style.opacity=vis?Math.min(ease(lt/.5),1-ease((t-b)/.5)):0; if(!vis) continue; s.style.transform=`scale(${1+.025*Math.min(1,Math.max(0,lt/(b-a)))})`;
    s.querySelectorAll('.t').forEach(e=>{const k=ease((lt-(+e.dataset.in))/.6); e.style.opacity=k; e.style.transform=`translateY(${(1-k)*30}px)`;});
    const fc=s.querySelector('#fc'); if(fc) drawFlag(fc,t); }
  document.getElementById('bar').style.width=(t/DUR*100)+'%'; document.getElementById('pat').style.transform=`translate(${(t*6)%40}px,0)`;
};
</script></body></html>
