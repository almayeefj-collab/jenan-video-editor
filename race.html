<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة السباق · رحلة المراسيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap">
<style>
/* Race board for the projector / Teams screen share: night sky over Kuwait, route of 8 stations, live ranking */
:root{
  --sky1:#0d1433;--sky2:#2a2466;--paper:#fffaf0;--sand:#f6e6c8;--gold:#f2b134;--teal:#11807a;--green:#1f9d55;--red:#d7263d;--muted:#b8b3cc;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,"Segoe UI",sans-serif;color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#3b2f7a 0,transparent 60%),linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--paper);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,52px);margin:0;color:var(--gold);line-height:1.1;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:16px;color:var(--sand);font-weight:500}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:rgba(255,255,255,.1);border-radius:999px;padding:7px 15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.live::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-inline-end:7px;vertical-align:middle}
.pill.live.on::before{background:#2ee07a;box-shadow:0 0 8px #2ee07a}
.pill.live.off::before{background:var(--red)}
button{font-family:var(--body);cursor:pointer}
.btn{border:2px solid rgba(255,250,240,.5);background:transparent;color:var(--paper);border-radius:12px;padding:7px 14px;font-weight:700;font-size:15px}
.btn.arm{background:var(--red);border-color:var(--red)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.route-wrap{overflow-x:auto;padding-bottom:6px}
.route{display:grid;grid-template-columns:repeat(8,minmax(118px,1fr));gap:8px;min-width:980px;position:relative;padding-top:6px}
.route::before{content:"";position:absolute;top:40px;right:6%;left:6%;height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 24px)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.dot{width:70px;height:70px;border-radius:50%;background:#1d2a5c;border:3px solid var(--gold);display:grid;place-items:center;font-size:26px;position:relative;z-index:1}
.node.final .dot{background:var(--teal);box-shadow:0 0 22px rgba(17,128,122,.7)}
.nm{font-weight:700;font-size:15px;text-align:center;color:var(--sand)}
.cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kids{display:flex;flex-direction:column;gap:5px;width:100%}
.kid{border-radius:10px;padding:5px 8px;font-weight:700;font-size:14.5px;color:#14122a;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.kid.done{outline:2px solid var(--gold)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px}
.panel h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 10px;color:var(--gold)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;min-height:210px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.step .who{font-weight:900;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .bar{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font-family:var(--display);font-size:38px;color:#3b2206}
.p1 .bar{height:130px;background:linear-gradient(#ffd66b,#f2b134)}
.p2 .bar{height:96px;background:linear-gradient(#eef1f5,#b9c3cf)}
.p3 .bar{height:74px;background:linear-gradient(#f0b98a,#c8814a)}
.step .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.empty .who{color:var(--muted);font-weight:500}
.board{display:flex;flex-direction:column;gap:6px}
.r{display:grid;grid-template-columns:38px minmax(0,1fr) 120px 80px 64px;gap:8px;align-items:center;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.r.h{background:none;color:var(--muted);font-size:13px;font-weight:700;padding-block:2px}
.r span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.r.done{background:rgba(242,177,52,.16)}
.empty-note{color:var(--muted);text-align:center;padding:22px 8px;font-size:17px;line-height:1.7}
.foot{color:var(--muted);font-size:13.5px;text-align:center;line-height:1.7}
.foot code{direction:ltr;unicode-bidi:isolate;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;user-select:all}
@media (max-width:860px){.grid2{grid-template-columns:1fr}.r{grid-template-columns:30px minmax(0,1fr) 96px 60px}.r .mz{display:none}}
@media (prefers-reduced-motion:reduce){.kid{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>لوحة السباق<small>رحلة المراسيم: أوجد الخطأ في حالات إصدار المراسيم بقوانين</small></h1>
    <div class="pills">
      <span class="pill" id="nPlayers">0 مشاركة</span>
      <span class="pill" id="nDone">0 وصلن المجلس</span>
      <span class="pill live" id="live">جارٍ الاتصال…</span>
      <button class="btn" id="resetBtn" type="button">سباق جديد</button>
    </div>
  </header>

  <section class="route-wrap" aria-label="مسار السباق"><div class="route" id="route"></div></section>

  <div class="grid2">
    <section class="panel" aria-label="أول من وصل">
      <h2>أول من وصل مجلس الأمة</h2>
      <div class="podium" id="podium"></div>
    </section>
    <section class="panel" aria-label="الترتيب">
      <h2>الترتيب</h2>
      <div class="board" id="board"></div>
    </section>
  </div>
  <p class="foot">رابط الطالبات: <code id="studentLink"></code></p>
</div>

<script>
(()=>{
"use strict";
const STATIONS=[["البداية","🚪"],["أبراج الكويت","🗼"],["برج التحرير","📡"],["المسجد الكبير","🕌"],["سوق المباركية","🏮"],["برج الحمراء","🏙️"],["جسر جابر","🌉"],["مجلس الأمة","🏛️"]];
const qs=new URLSearchParams(location.search);
const ROOM=(qs.get("r")||"marasim-k7q2x9wd4f").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,60);
const POLL=qs.get("poll")==="1";
const BASE="https://ntfy.sh/"+ROOM;
const COLORS=["#ffd166","#06d6a0","#8ecae6","#ffadad","#cdb4db","#f4a261","#b5e48c","#ffc8dd","#a0c4ff","#fdffb6"];
const colorFor=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const $=id=>document.getElementById(id);

const studentURL=new URL("./",location.href); if(qs.get("r")) studentURL.search="?r="+ROOM;
$("studentLink").textContent=studentURL.href;

// race start: messages older than this (server time, seconds) are ignored
let since=(()=>{try{return +localStorage.getItem("mr_since_"+ROOM)||0}catch(e){return 0}})();
if(!since||Date.now()/1000-since>12*3600) since=Math.floor(Date.now()/1000)-3*3600;
const players=new Map(); const seen=new Set(); let lastId="";

function ingest(m){
  if(!m||m.event!=="message"||seen.has(m.id)) return; seen.add(m.id); lastId=m.id;
  if(m.time<since) return;
  let d; try{d=JSON.parse(m.message)}catch(e){return}
  if(!d||d.app!=="marasim"||typeof d.id!=="string"||typeof d.n!=="string") return;
  const name=d.n.trim().slice(0,24); if(!name) return;
  const s=Math.max(0,Math.min(7,Math.floor(+d.s)||0));
  const p=players.get(d.id)||{id:d.id,first:m.time};
  // a replay restarts at 0: start the run over
  if(p.s!=null && s<p.s && !d.d){p.done=false;p.doneAt=null}
  Object.assign(p,{name,s,sc:+d.sc||0,m:+d.m||0,at:m.time});
  if(d.d&&!p.done){p.done=true;p.doneAt=m.time;p.s=7}
  players.set(d.id,p); schedule();
}
let pending=false; function schedule(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;render()})}}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const clock=t=>{const d=new Date(t*1000);return d.toLocaleTimeString("ar-KW",{hour:"numeric",minute:"2-digit",second:"2-digit"})};
function render(){
  const all=[...players.values()];
  const done=all.filter(p=>p.done).sort((a,b)=>a.doneAt-b.doneAt);
  $("nPlayers").textContent=all.length+(all.length===1?" مشاركة":" مشاركات");
  $("nDone").textContent=done.length+" وصلن المجلس";
  // route
  const route=$("route"); route.textContent="";
  STATIONS.forEach(([nm,ic],i)=>{
    const n=el("div","node"+(i===7?" final":"")); const dot=el("div","dot",ic); dot.setAttribute("aria-hidden","true");
    const here=all.filter(p=>p.s===i).sort((a,b)=>i===7?a.doneAt-b.doneAt:a.at-b.at);
    const kids=el("div","kids");
    here.forEach(p=>{const k=el("div","kid"+(p.done?" done":""),(p.done?"🏆 ":"")+p.name);k.style.background=colorFor(p.name);k.title=p.name;kids.append(k)});
    n.append(dot,el("div","nm",nm),el("div","cnt",here.length?here.length+" هنا":""),kids); route.append(n);
  });
  // podium (2nd, 1st, 3rd)
  const pod=$("podium"); pod.textContent="";
  [[1,"p2","٢"],[0,"p1","١"],[2,"p3","٣"]].forEach(([k,c,lab])=>{const p=done[k];const st=el("div","step "+c+(p?"":" empty"));
    st.append(el("div","who",p?p.name:"…"),el("div","meta",p?p.sc+" نقطة · "+clock(p.doneAt):""),el("div","bar",lab));pod.append(st)});
  // board
  const b=$("board"); b.textContent="";
  if(!all.length){b.append(el("div","empty-note","بانتظار الطالبات… أول ما تكتب الطالبة اسمها وتضغط «افتح البوابة» يطلع اسمها هنا."));return}
  const h=el("div","r h");["#","الطالبة","المحطة","النقاط","أخطاء"].forEach((t,j)=>{const s=el("span",j===4?"mz":null,t);h.append(s)});b.append(h);
  const rank=all.sort((a,b)=>(b.done-a.done)||(a.done?a.doneAt-b.doneAt:0)||(b.s-a.s)||(b.sc-a.sc)||(a.at-b.at));
  rank.forEach((p,i)=>{const r=el("div","r"+(p.done?" done":""));
    const nmS=el("span");const sw=el("i","sw");sw.style.background=colorFor(p.name);nmS.append(sw,(p.done?"🏆 ":"")+p.name);
    r.append(el("span",null,String(i+1)),nmS,el("span",null,p.done?"وصلت ✓":STATIONS[p.s][0]),el("span",null,String(p.sc)),el("span","mz",String(p.m)));b.append(r)});
}

// connection: live stream, with polling as a fallback
const live=$("live");
function setLive(ok){live.className="pill live "+(ok?"on":"off");live.textContent=ok?"متصل مباشرة":"انقطع الاتصال… يعيد المحاولة"}
async function poll(){
  try{const r=await fetch(BASE+"/json?poll=1&since="+(lastId||since));const t=await r.text();
    t.split("\n").forEach(line=>{if(line.trim()){try{ingest(JSON.parse(line))}catch(e){}}});setLive(true)}
  catch(e){setLive(false)}
  setTimeout(poll,POLL?2000:6000);
}
function stream(){
  if(POLL||!window.EventSource){poll();return}
  let es; let fails=0;
  const open=()=>{es=new EventSource(BASE+"/sse?since="+(lastId||since));
    es.onopen=()=>{fails=0;setLive(true)};
    es.onmessage=e=>{try{ingest(JSON.parse(e.data))}catch(x){}};
    es.onerror=()=>{setLive(false);fails++;if(fails>4){es.close();poll()}}};
  open();
}
const rb=$("resetBtn"); let armT=0;
rb.onclick=()=>{if(!rb.classList.contains("arm")){rb.classList.add("arm");rb.textContent="اضغطي مرة ثانية للتأكيد";clearTimeout(armT);armT=setTimeout(()=>{rb.classList.remove("arm");rb.textContent="سباق جديد"},3000);return}
  since=Math.floor(Date.now()/1000);try{localStorage.setItem("mr_since_"+ROOM,String(since))}catch(e){}
  players.clear();rb.classList.remove("arm");rb.textContent="سباق جديد";render()};
render(); stream();
})();
</script>
</body>
</html>
