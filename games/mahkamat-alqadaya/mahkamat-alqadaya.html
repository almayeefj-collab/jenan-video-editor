<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محكمة القضايا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>:root{color-scheme:dark;--display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;--body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:#0d1130;color:#fffaf0;font-family:var(--body)}
/* محكمة القضايا — full-screen case-sorting game with animated clips (fixed cinema look) */
.f-cs{background:linear-gradient(135deg,#2E3A59,#7B55F0 55%,#E5484D)}
.cs{position:fixed;inset:0;z-index:1000;direction:rtl;font-family:var(--body);color:#fffaf0;background:radial-gradient(circle at 50% -10%,#2b3570,#0d1130 70%);display:flex;flex-direction:column;overflow:auto}
.cs button{font:inherit;cursor:pointer}
.cs :focus-visible{outline:3px solid #F2B134;outline-offset:3px}
.cs-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.cs-title{font-family:var(--display);font-weight:800;font-size:22px;color:#F2B134}
.cs-pill{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cs-track{flex:1;display:flex;gap:4px;min-width:80px}
.cs-track i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.cs-track i.ok{background:#3FD19A}.cs-track i.no{background:#FF7B7F}.cs-track i.now{background:#fff;box-shadow:0 0 10px #fff}
.cs-x{background:rgba(255,255,255,.1);color:#fffaf0;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.cs-main{flex:1;display:grid;align-content:start;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 16px 16px;align-items:start;width:100%;max-width:1500px;margin:0 auto}
.cs-stage{width:100%;max-width:calc((100vh - 150px)*16/9);min-width:0;justify-self:center}
.cv{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.45);border:3px solid #1d2450}
.cv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv-cap{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;background:rgba(10,12,30,.84);color:#fff;font-size:clamp(15px,2.3vw,26px);font-weight:700;padding:6px 18px;border-radius:12px;text-align:center;line-height:1.5}
.cv-cap:empty{display:none}
.cv-cap.in{animation:cvCap .4s ease both}
@keyframes cvCap{from{opacity:0;transform:translate(-50%,10px)}}
.cv-tag{position:absolute;top:3%;right:2%;background:#E5484D;color:#fff;font-weight:800;font-size:clamp(11px,1.5vw,15px);padding:3px 12px;border-radius:8px;letter-spacing:.02em}
.cv-end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,30,.35)}
.cv-end button{border:0;border-radius:999px;background:rgba(255,250,240,.95);color:#1d1a2b;font-weight:800;font-size:clamp(16px,2.4vw,22px);padding:10px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cv-bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.cv-bar button{background:rgba(255,255,255,.12);color:#fffaf0;border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.cv-bar button[aria-pressed="false"]{opacity:.5}
.cv-prog{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.cv-prog i{display:block;height:100%;width:0;background:#F2B134;border-radius:99px}
.cv.paused *{animation-play-state:paused!important}
.cs-side{background:#fffaf0;color:#1d1a2b;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.cs-who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-bottom:2px dashed #e3d7bd;padding-bottom:12px}
.cs-who small{font-size:13px;font-weight:700;color:#6d6680}
.cs-name{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.4vw,28px);line-height:1.25;color:#11807a;min-height:1.3em}
.cs-name.spin{color:#9a93ad}
.cs-sm{border:1.5px solid #e3d7bd;background:#fff;color:#1d1a2b;border-radius:10px;padding:4px 12px;font-weight:700;font-size:13.5px}
.cs-side h3{margin:0;font-family:var(--display);font-size:20px;text-align:center}
.cs-opts{display:grid;grid-template-columns:1fr;gap:8px}
.cs-opt{display:flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:11px 14px;font-weight:800;font-size:19px;background:var(--cc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22);text-align:start}
.cs-opt span{font-size:24px;line-height:1;width:30px;text-align:center}
.cs-opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.cs-opt:disabled{cursor:default}
.cs-opt.wrong{opacity:.4;text-decoration:line-through}
.cs-opt.right{box-shadow:0 0 0 4px #F2B134,0 4px 0 rgba(0,0,0,.22);animation:csPulse .6s ease 2}
.cs-opt.dim{opacity:.35}
@keyframes csPulse{50%{transform:scale(1.04)}}
@keyframes csShake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cs-opt.shake{animation:csShake .35s 2}
.cs-fb{border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.65}
.cs-fb:empty{display:none}
.cs-fb.good{background:#e1f6ea;color:#0f5b31}.cs-fb.no{background:#fde4e7;color:#8c1325}.cs-fb.rev{background:#fff1d6;color:#6b4300}
.cs-fb b{font-size:18px}
.cs-fb .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cs-btn{border:0;border-radius:14px;padding:11px 20px;font-weight:800;font-size:18px;background:#F2B134;color:#3b2206;box-shadow:0 4px 0 #a3700f}
.cs-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a3700f}
.cs-btn.sm{font-size:15px;padding:7px 14px;box-shadow:0 3px 0 #a3700f}
.cs-btn.alt{background:#fff;color:#1d1a2b;box-shadow:0 3px 0 #c9bfa8;border:1.5px solid #e3d7bd}
.cs-case{font-size:15px;color:#6d6680;text-align:center}
.cs-case b{color:#1d1a2b}
.cs-center{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.cs-menu{width:min(640px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.06);border:2px solid rgba(242,177,52,.5);border-radius:24px;padding:24px 20px}
.cs-menu h2{font-family:var(--display);font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0;color:#F2B134}
.cs-menu p{margin:0;font-size:17px;line-height:1.7;color:#e9e4f7}
.cs-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cs-chip{border:2px solid rgba(255,255,255,.35);background:transparent;color:#fffaf0;border-radius:999px;padding:6px 16px;font-weight:800;font-size:16px}
.cs-chip[aria-pressed="true"]{background:#F2B134;border-color:#F2B134;color:#3b2206}
.cs-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cs-legend div{background:var(--cc);border-radius:14px;padding:10px 6px;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cs-legend div span{font-size:26px}
.cs-small{font-size:14px;color:#b9b2d6}
.cs-end{width:min(820px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.cs-end h2{font-family:var(--display);font-size:clamp(32px,6vw,50px);margin:0;color:#F2B134}
.cs-winners{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cs-winners span{background:#fffaf0;color:#1d1a2b;border-radius:999px;padding:5px 14px;font-weight:800}
.cs-winners span b{color:#11807a;margin-inline-start:6px}
.cs-recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;text-align:start}
.cs-recap div{background:#fffaf0;color:#1d1a2b;border-radius:16px;padding:12px 14px;border-top:6px solid var(--cc)}
.cs-recap h4{margin:0 0 4px;font-family:var(--display);font-size:19px;color:var(--cc)}
.cs-recap p{margin:0;font-size:14.5px;line-height:1.6}
.cs-recap em{display:block;font-style:normal;font-weight:700;margin-top:6px;font-size:14.5px}
.cs-conf{position:fixed;inset:0;pointer-events:none;z-index:1001;overflow:hidden}
.cs-conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:csFall 1.6s ease-in forwards}
@keyframes csFall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:900px){.cs-main{grid-template-columns:1fr}.cs-stage{max-width:none}.cs-opts{grid-template-columns:1fr 1fr}.cs-opts .cs-opt:last-child{grid-column:1/-1}.cs-legend{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.cs-opt{font-size:16px;padding:10px}.cs-opt span{font-size:20px;width:24px}.cs-title{font-size:18px}}
/* clip animations */
.cv svg g[class^="cv-"]{transform-box:fill-box}
.cv-inL{animation:cvInL var(--du) cubic-bezier(.2,.8,.3,1) var(--dl) both}@keyframes cvInL{from{transform:translateX(-560px)}}
.cv-inR{animation:cvInR var(--du) cubic-bezier(.2,.8,.3,1) var(--dl) both}@keyframes cvInR{from{transform:translateX(560px)}}
.cv-outL{animation:cvOutL var(--du) ease-in var(--dl) both}@keyframes cvOutL{to{transform:translateX(-700px)}}
.cv-outR{animation:cvOutR var(--du) ease-in var(--dl) both}@keyframes cvOutR{to{transform:translateX(700px)}}
.cv-mv{animation:cvMv var(--du) ease-in-out var(--dl) both}@keyframes cvMv{to{transform:translate(var(--dx),var(--dy))}}
.cv-pop{transform-origin:50% 100%;animation:cvPop .5s cubic-bezier(.3,1.6,.5,1) var(--dl) both}@keyframes cvPop{from{transform:scale(0);opacity:0}}
.cv-fade{animation:cvFade .6s ease var(--dl) both}@keyframes cvFade{from{opacity:0}}
.cv-gone{animation:cvGone .5s ease var(--dl) both}@keyframes cvGone{to{opacity:0}}
.cv-talk{animation:cvBob .26s ease-in-out var(--dl) 10 alternate}@keyframes cvBob{to{transform:translateY(-5px)}}
.cv-walk{animation:cvBob .2s ease-in-out var(--dl) var(--n) alternate}
.cv-shake{animation:cvShake .1s linear var(--dl) 8 alternate}@keyframes cvShake{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.cv-stamp{transform-origin:50% 50%;animation:cvStamp .5s cubic-bezier(.3,1.4,.5,1) var(--dl) both}@keyframes cvStamp{from{transform:scale(2.6) rotate(-25deg);opacity:0}}
.cv-fall{transform-origin:50% 100%;animation:cvFall .5s ease-in var(--dl) both}@keyframes cvFall{to{transform:rotate(80deg)}}
.cv-hop{animation:cvHop .38s ease var(--dl) 2}@keyframes cvHop{50%{transform:translateY(-18px)}}
.cv-spin{transform-origin:50% 100%;animation:cvSpin 1.2s linear infinite}@keyframes cvSpin{to{transform:rotate(360deg)}}
.cv-pulse{transform-origin:50% 50%;animation:cvPulse .5s ease-in-out var(--dl) infinite alternate}@keyframes cvPulse{to{transform:scale(1.12)}}
.cv-turn{transform-origin:50% 50%;animation:cvTurn .3s ease var(--dl) both}@keyframes cvTurn{from{transform:scaleX(1)}50%{transform:scaleX(0)}to{transform:scaleX(-1)}}
</style></head><body>
<script>window.__daftar=(function(){const N=["النايفه فلاح موسى العجمي", "جوري سالم ناصر المسند", "حصه صالح خالد المري", "حوراء منصور حسين الحلاق", "دعاء حيدر علي العنزي", "دلال مهدى عبد الله العجمي", "ريم عبدالله حمود المجرب", "سارة محمد عبدالله الحربي", "ضحى حمد محمد المجرن", "عاليه علي سعد مطر", "عهود احمد مطلق الوصيص", "غدير سلمان يوسف علي السلمان", "فاطمه علي عبد الكريم المزدي", "لجين حسين صلاح الجدي", "لولوه محمد بدر علي", "مريم احمد علي فرحان", "مريم رمضان علي رمضان مندني", "مريم سليمان محمود الابراهيم", "مريم نواف بدر الفيلكاوي", "ملاك احمد حسين الرمضان", "منوه مفلح عايد العازمي", "نجلا مسلط مخلد العتيبي", "نجلاء جابر عبد الهادي المري", "ندى صباح عيد الشريع", "نوير فلاح موسى العجمي", "وتين سالم راشد الهاجري"],ids=N.map((_,i)=>'s'+i),P=[];
return{pool:()=>({ids,from:'طالبات ١٢ ع ٨'}),nm:id=>N[+id.slice(1)]||'—',uid:()=>'g'+Math.random().toString(36).slice(2,8),
award:(g,q,sid)=>{if(P.some(p=>p.g===g&&p.q===q&&p.sid===sid))return false;P.push({g,q,sid});return true},
byGame:g=>{const o={};P.forEach(p=>{if(p.g===g)o[p.sid]=(o[p.sid]||0)+1});return o},
done:()=>window.__cases.open()}})();
/* ---------- محكمة القضايا: animated case clips, sort each into its court type ---------- */
(function(){
const K='#2b2233',SK='#EDBE96',GR=395,PS=1.45;
const CAT={
  tij:{n:'التجارية',ic:'🏪',c:'#D9850A',def:'هي القضايا التي تنشأ بين التجار أو الشركات بسبب المعاملات التجارية.',ex:'تاجر لم يدفع قيمة البضاعة.'},
  mad:{n:'المدنية',ic:'🏠',c:'#2F86D6',def:'هي القضايا المتعلقة بحقوق الأفراد والتزاماتهم المالية أو ممتلكاتهم.',ex:'شخص لم يُرجع المبلغ الذي اقترضه.'},
  jaz:{n:'الجزائية',ic:'⚖️',c:'#D93B41',def:'هي القضايا التي تتعلق بارتكاب الجرائم والمخالفات التي يعاقب عليها القانون.',ex:'شخص سرق هاتفاً.'},
  ahw:{n:'الأحوال الشخصية',ic:'👪',c:'#C93F8E',def:'هي القضايا المتعلقة بالأسرة والعلاقات الزوجية وما يترتب عليها.',ex:'أم تطالب بحضانة أطفالها.'},
  idr:{n:'الإدارية',ic:'🏢',c:'#14957F',def:'هي القضايا التي تنشأ بين الأفراد أو الموظفين والجهات الحكومية بسبب القرارات الإدارية.',ex:'موظف يعترض على قرار فصله من الحكومة.'}};
const CK=Object.keys(CAT);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st=(w=2)=>`stroke="${K}" stroke-width="${w}" stroke-linejoin="round"`;
const T=(x,y,s,fs,fill,fw=700)=>`<text x="${x}" y="${y}" font-size="${fs}" fill="${fill}" font-weight="${fw}" text-anchor="middle" direction="rtl" font-family="Tajawal,Tahoma,sans-serif">${esc(s)}</text>`;
const EM=(x,y,e,fs)=>`<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle">${e}</text>`;

/* ---------- people (origin = feet) ---------- */
function face(m,y){
  const L=`fill="none" stroke="${K}" stroke-width="2.3" stroke-linecap="round"`,my=y+10;
  const e=`<circle cx="-6.5" cy="${y}" r="2.3" fill="${K}"/><circle cx="6.5" cy="${y}" r="2.3" fill="${K}"/>`;
  const M={h:`<path d="M-6.5 ${my-1} Q0 ${my+6} 6.5 ${my-1}" ${L}/>`,
    n:`<path d="M-5 ${my} H5" ${L}/>`,
    a:`<path d="M-6 ${my+2} Q0 ${my-4} 6 ${my+2}" ${L}/><path d="M-11 ${y-8} L-3 ${y-5} M11 ${y-8} L3 ${y-5}" ${L}/>`,
    s:`<path d="M-6 ${my+2} Q0 ${my-4} 6 ${my+2}" ${L}/><path d="M-10 ${y-6} L-3 ${y-8} M10 ${y-6} L3 ${y-8}" ${L}/><path d="M9 ${y+3} q2.5 5 0 7 q-2.5 -2 0 -7" fill="#5AB0F0"/>`,
    o:`<ellipse cx="0" cy="${my+1}" rx="3.6" ry="4.6" fill="${K}"/><path d="M-10 ${y-9} L-3 ${y-9} M10 ${y-9} L3 ${y-9}" ${L}/>`,
    w:`<path d="M-5 ${my+1} Q-2.5 ${my-2} 0 ${my+1} Q2.5 ${my+4} 5 ${my+1}" ${L}/>`,
    sly:`<path d="M-6 ${my} Q2 ${my+4} 7 ${my-3}" ${L}/><path d="M-10 ${y-6} L-3 ${y-7} M10 ${y-8} L3 ${y-6}" ${L}/>`};
  return e+(M[m]||M.n)}
const POSE={d:[27,-46],f:[48,-80],u:[34,-136],p:[54,-100],h:[40,-60],c:[14,-66]};
function arm(sx,p,col,hold,ff){
  if(!p)return '';let[hx,hy]=POSE[p]||POSE.d;
  if(sx<0)hx=(p==='f'||p==='p'||p==='c')?hx*.62:-hx;
  const mx=(sx+hx)/2+(sx<0?-8:8),my=(-90+hy)/2+6,d=`M${sx} -90 Q${mx} ${my} ${hx} ${hy}`;
  return `<path d="${d}" fill="none" stroke="${K}" stroke-width="12" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/>`+
    (hold?`<g transform="translate(${hx} ${hy+14}) scale(${ff?-.55:.55} .55)">${hold}</g>`:'')+
    `<circle cx="${hx}" cy="${hy}" r="5.5" fill="${SK}" stroke="${K}" stroke-width="1.6"/>`}
const HAIR='#2a1d14';
function person(o={}){
  const k=o.k||'man',m=o.m||'n',a=o.a||'dd';
  if(k==='boy'||k==='girl')return `<g transform="scale(.6)">${person(Object.assign({},o,{k:k+'x'}))}</g>`;
  let col,body,head,y=-116;
  const legs=(c)=>`<rect x="-16" y="-42" width="13" height="40" fill="${c}" ${st(1.5)}/><rect x="3" y="-42" width="13" height="40" fill="${c}" ${st(1.5)}/><path d="M-19 -2 H-2 M2 -2 H19" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>`;
  const bald=`<circle cx="0" cy="-120" r="18" fill="${SK}" ${st()}/>`;
  if(k==='woman'){col=o.c||'#1F1D26';const h=o.h||'#7B55F0';y=-119;
    body=`<path d="M-32 -2 L-19 -95 Q0 -103 19 -95 L32 -2 Z" fill="${col}" ${st()}/>`;
    head=`<circle cx="0" cy="-121" r="24" fill="${h}" ${st()}/><path d="M-21 -110 Q-18 -92 0 -92 Q18 -92 21 -110 Z" fill="${h}"/><ellipse cx="0" cy="-117" rx="15.5" ry="17" fill="${SK}"/>`+face(m,y);
  }else if(k==='rep'||k==='thief'||k==='boyx'){
    col=o.c||(k==='thief'?'#3b3f4a':k==='boyx'?'#F2F1EA':'#2E3A59');y=-119;
    if(k==='boyx')body=`<path d="M-24 -2 L-20 -95 Q0 -103 20 -95 L24 -2 Z" fill="${col}" ${st()}/>`;
    else body=legs(k==='thief'?'#34495E':'#262c40')+`<path d="M-25 -38 L-21 -95 Q0 -103 21 -95 L25 -38 Z" fill="${col}" ${st()}/>`+
      (k==='rep'?`<path d="M-9 -97 L0 -76 L9 -97 Z" fill="#fff"/><path d="M-3 -93 H3 L5 -72 L0 -65 L-5 -72 Z" fill="${o.t||'#D7263D'}"/>`:'');
    head=bald+`<path d="M-18 -122 Q-19 -142 0 -142 Q19 -142 18 -122 Q14 -133 -2 -131 Q-12 -130 -18 -122 Z" fill="${HAIR}"/>`+face(m,y);
    if(k==='thief')head=bald+face(m,y)+`<rect x="-19" y="-127" width="38" height="10" rx="3" fill="#111"/><circle cx="-6.5" cy="-122" r="2.6" fill="#fff"/><circle cx="6.5" cy="-122" r="2.6" fill="#fff"/><path d="M-19 -128 Q-18 -144 0 -144 Q18 -144 19 -128 Z" fill="#111"/><rect x="2" y="-131" width="30" height="5" rx="2.5" fill="#111"/>`;
  }else if(k==='girlx'){col=o.c||'#E8559A';y=-119;
    body=`<path d="M-30 -2 L-17 -95 Q0 -103 17 -95 L30 -2 Z" fill="${col}" ${st()}/>`;
    head=`<circle cx="0" cy="-143" r="10" fill="${HAIR}"/>`+bald+`<path d="M-19 -116 Q-22 -142 0 -142 Q22 -142 19 -116 Q16 -132 0 -132 Q-16 -132 -19 -116 Z" fill="${HAIR}"/>`+face(m,y);

function playCase(C){stopVid();V={C,bi:-1,el:0,paused:false,t0:performance.now(),tot:C.b.reduce((s,b)=>s+b.d,0)};
  const cv=$('cv');if(cv)cv.classList.remove('paused');const en=$('cvend');if(en)en.hidden=true;setPP();V.raf=requestAnimationFrame(tick)}
function tick(now){if(!V)return;if(!V.paused)V.el=now-V.t0;
  let acc=0,bi=0;for(;bi<V.C.b.length;bi++){acc+=V.C.b[bi].d;if(V.el<acc)break}
  const pr=$('cvprog');if(pr)pr.style.width=Math.min(100,V.el/V.tot*100)+'%';
  if(bi>=V.C.b.length){V.done=true;const en=$('cvend');if(en)en.hidden=false;setPP();return}
  if(bi!==V.bi){V.bi=bi;showBeat(V.C.b[bi])}
  V.raf=requestAnimationFrame(tick)}
function showBeat(b){const sv=$('cvsvg'),cp=$('cvcap');if(!sv)return;sv.innerHTML=DEFS+b.bg+b.e.join('');
  if(cp){cp.textContent=b.cap;cp.classList.remove('in');void cp.offsetWidth;cp.classList.add('in')}speak(b.cap)}
function setPP(){const b=$('cvpp');if(!b||!V)return;b.textContent=V.done?'↻ من البداية':V.paused?'▶ تشغيل':'⏸ إيقاف'}
function pp(){if(!V)return;if(V.done){playCase(V.C);return}
  V.paused=!V.paused;$('cv').classList.toggle('paused',V.paused);if(!V.paused)V.t0=performance.now()-V.el;
  try{V.paused?speechSynthesis.pause():speechSynthesis.resume()}catch(e){}setPP()}
let VOICE=false;try{VOICE=localStorage.getItem('cs_voice')==='1'}catch(e){}
function arVoice(){try{return speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang))}catch(e){return null}}
function speak(t){if(!VOICE||!window.speechSynthesis)return;const v=arVoice();if(!v)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

/* ---------- game ---------- */
const D=()=>window.__daftar;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(n){const by={};CASES.forEach((c,i)=>(by[c.c]=by[c.c]||[]).push(i));CK.forEach(k=>by[k]=shuffle(by[k]));
  const out=[];let r=0;while(out.length<n&&r<10){CK.forEach(k=>{if(out.length<n&&by[k][r]!=null)out.push(by[k][r])});r++}
  /* shuffle within each group of 5 so the order of types is not predictable */
  let res=[];for(let i=0;i<out.length;i+=5)res=res.concat(shuffle(out.slice(i,i+5)));return res}
function open(){if(!D())return;stopVid();const ov=document.createElement('div');ov.className='cs';ov.id='cs';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','محكمة القضايا');
  document.body.appendChild(ov);document.body.style.overflow='hidden';ov.addEventListener('click',onClick);
  G={stage:'menu',n:G&&G.n||10};draw()}
function close(){stopVid();const ov=$('cs');if(ov)ov.remove();document.body.style.overflow='';G=G?{n:G.n}:null;const d=D();if(d)d.done()}
function draw(){const ov=$('cs');if(!ov)return;
  if(G.stage==='menu'){const P=D().pool();
    ov.innerHTML=`<div class="cs-hud"><span class="cs-title">محكمة القضايا</span><span style="flex:1"></span><button class="cs-x" data-c="fs">⛶ ملء الشاشة</button></div>
    <div class="cs-center"><div class="cs-menu"><h2>محكمة القضايا</h2>
      <p>مقطع قصير لكل قضية. الموقع يختار طالبة عشوائياً، تشوف المقطع وتحدد نوع القضية والمحكمة اللي تنظر فيها. الإجابة الصح = نقطة للطالبة.</p>
      <div class="cs-legend">${CK.map(k=>`<div style="--cc:${CAT[k].c}"><span>${CAT[k].ic}</span>${CAT[k].n}</div>`).join('')}</div>
      <div><p style="margin-bottom:8px">عدد القضايا</p><div class="cs-chips">${[[5,'٥ (وحدة لكل نوع)'],[10,'١٠'],[20,'كل القضايا ٢٠']].map(([n,l])=>`<button class="cs-chip" data-c="n" data-v="${n}" aria-pressed="${G.n===n}">${l}</button>`).join('')}</div></div>
      <div class="cs-chips"><button class="cs-chip" data-c="voice" aria-pressed="${VOICE}">🔊 قراءة الشرح بصوت</button></div>
      <p class="cs-small">الأسماء من: ${esc(P.from)} · ${P.ids.length} طالبة</p>
      <div><button class="cs-btn" data-c="start">ابدئي المحاكمة</button></div></div></div>`;return}
  if(G.stage==='end'){const by=D().byGame(G.id),ws=Object.keys(by).sort((a,b)=>by[b]-by[a]),ok=G.log.filter(x=>x.ok).length;
    ov.innerHTML=`<div class="cs-hud"><span class="cs-title">محكمة القضايا</span><span style="flex:1"></span><button class="cs-x" data-c="exit">القائمة الرئيسية</button></div>
    <div class="cs-center"><div class="cs-end"><h2>رُفعت الجلسة!</h2>
      <p class="cs-pill" style="align-self:center">${ok} إجابة صحيحة من ${G.order.length} قضية</p>
      ${ws.length?`<div><p style="margin:0 0 8px;font-weight:700">نقاط هالجلسة</p><div class="cs-winners">${ws.map(id=>`<span>${esc(D().nm(id))}<b>+${by[id]}</b></span>`).join('')}</div></div>`:''}
      <h3 style="margin:6px 0 0;font-family:var(--display);font-size:22px">طريقة سهلة للتثبيت: تذكّري نوع القضية من خلال المثال</h3>
      <div class="cs-recap">${CK.map(k=>`<div style="--cc:${CAT[k].c}"><h4>${CAT[k].ic} ${CAT[k].n}</h4><p>${CAT[k].def}</p><em>مثال: ${CAT[k].ex}</em></div>`).join('')}</div>
      <div class="cs-chips"><button class="cs-btn" data-c="again">جلسة جديدة</button><button class="cs-btn alt" data-c="exit">القائمة الرئيسية</button></div></div></div>`;return}
  const C=CASES[G.order[G.i]];
  ov.innerHTML=`<div class="cs-hud"><span class="cs-title">محكمة القضايا</span><div class="cs-track">${G.order.map((_,i)=>{const l=G.log.find(x=>x.i===i&&x.final);return `<i class="${i===G.i?'now':l?(l.ok?'ok':'no'):''}"></i>`}).join('')}</div><span class="cs-pill">القضية ${G.i+1} / ${G.order.length}</span><button class="cs-x" data-c="exit">إنهاء</button></div>
  <div class="cs-main"><div class="cs-stage"><div class="cv" id="cv"><svg id="cvsvg" viewBox="0 0 800 450" role="img" aria-label="${esc(C.t)}"></svg><span class="cv-tag">قضية رقم ${G.i+1}</span><div class="cv-cap" id="cvcap"></div><div class="cv-end" id="cvend" hidden><button data-c="replay">↻ شاهدي المقطع مرة ثانية</button></div></div>
    <div class="cv-bar"><button id="cvpp" data-c="pp">⏸ إيقاف</button><div class="cv-prog"><i id="cvprog"></i></div><button data-c="replay">↻ إعادة</button><button data-c="voice" aria-pressed="${VOICE}" title="قراءة الشرح بصوت">🔊</button></div></div>
  <aside class="cs-side" id="csside"></aside></div>`;
  drawSide()}
function drawSide(){const el=$('csside');if(!el||!G||G.stage!=='play')return;const C=CASES[G.order[G.i]],wrong=G.tries.map(t=>t.k),fin=G.res==='ok'||G.res==='reveal';
  let fb='';
  if(G.res==='ok')fb=`<div class="cs-fb good"><b>✓ صح! قضية ${CAT[C.c].n}</b><br>+١ نقطة لـ ${esc(D().nm(G.cur))}<br>${CAT[C.c].def}</div>`;
  else if(G.res==='no'){const k=G.tries[G.tries.length-1].k;fb=`<div class="cs-fb no"><b>✗ مو ${CAT[k].n}</b><br>القضايا ${CAT[k].n}: ${CAT[k].def.replace('هي القضايا ','')}<div class="row2"><button class="cs-btn sm" data-c="steal">فرصة لطالبة ثانية</button><button class="cs-btn sm alt" data-c="reveal">كشف الإجابة</button></div></div>`}
  else if(G.res==='reveal')fb=`<div class="cs-fb rev"><b>الإجابة: قضية ${CAT[C.c].n} ${CAT[C.c].ic}</b><br>${CAT[C.c].def}</div>`;
  el.innerHTML=`<div class="cs-who"><small>${G.tries.length&&!fin&&G.res!=='no'?'فرصة ثانية لـ':'دور الطالبة'}</small><div class="cs-name${G.rolling?' spin':''}" id="csname">${G.cur?esc(D().nm(G.cur)):'…'}</div>${fin?'':`<button class="cs-sm" data-c="reroll" ${G.rolling?'disabled':''}>غايبة؟ اختاري غيرها</button>`}</div>
    <h3>من أي نوع هالقضية؟</h3>
    <div class="cs-opts">${CK.map(k=>{const cls=fin?(k===C.c?'right':'dim'):wrong.includes(k)?'wrong':'';return `<button class="cs-opt ${cls}" style="--cc:${CAT[k].c}" data-c="ans" data-k="${k}" ${fin||wrong.includes(k)||G.rolling||G.res==='no'?'disabled':''}><span>${CAT[k].ic}</span>${CAT[k].n}</button>`}).join('')}</div>
    ${fb}${fin?`<p class="cs-case">القضية: <b>${esc(C.t)}</b></p><button class="cs-btn" data-c="next">${G.i+1<G.order.length?'القضية التالية ←':'إنهاء الجلسة'}</button>`:''}`}
function pick(cb){const P=D().pool();let ids=P.ids.filter(x=>!G.used.includes(x)&&x!==G.cur);if(!ids.length){G.used=G.cur?[G.cur]:[];ids=P.ids.filter(x=>x!==G.cur)}if(!ids.length)ids=P.ids;
  const fin=ids[Math.floor(Math.random()*ids.length)];G.rolling=true;drawSide();let n=0;
  const iv=setInterval(()=>{const el=$('csname');if(!G||!el){clearInterval(iv);return}
    if(++n>=14){clearInterval(iv);G.rolling=false;G.cur=fin;G.used.push(fin);drawSide();if(cb)cb();return}
    el.textContent=D().nm(P.ids[Math.floor(Math.random()*P.ids.length)])},75)}
function round(){G.tries=[];G.res=null;G.cur=null;draw();playCase(CASES[G.order[G.i]]);pick()}
function confetti(){const c=document.createElement('div');c.className='cs-conf';const cols=['#F2B134','#3FD19A','#6CB8FF','#FF7B7F','#E8559A','#fff'];
  for(let i=0;i<36;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[i%cols.length];s.style.animationDelay=Math.random()*.5+'s';c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}
function onClick(e){const b=e.target.closest('[data-c]');if(!b||b.disabled||!G)return;const c=b.dataset.c;
  switch(c){
    case 'exit':close();break;
    case 'fs':try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}break;
    case 'n':G.n=+b.dataset.v;draw();break;
    case 'voice':VOICE=!VOICE;try{localStorage.setItem('cs_voice',VOICE?'1':'0')}catch(x){}
      document.querySelectorAll('.cs [data-c="voice"]').forEach(x=>x.setAttribute('aria-pressed',VOICE));if(!VOICE)try{speechSynthesis.cancel()}catch(x){}
      else if(window.speechSynthesis&&!arVoice()){try{speechSynthesis.getVoices()}catch(x){}}break;
    case 'start':case 'again':G={stage:'play',n:G.n,id:D().uid(),order:deck(G.n),i:0,used:[],log:[],tries:[],res:null,cur:null};round();break;
    case 'pp':pp();break;
    case 'replay':if(V)playCase(V.C);break;
    case 'reroll':pick();break;
    case 'ans':{if(!G.cur||G.rolling)return;const C=CASES[G.order[G.i]],k=b.dataset.k;
      if(k===C.c){D().award(G.id,G.i*10+G.tries.length,G.cur,'نشاط ختامي: محكمة القضايا');G.res='ok';G.log.push({i:G.i,sid:G.cur,ok:true,final:true});drawSide();confetti()}
      else{G.tries.push({sid:G.cur,k});G.res='no';drawSide();const w=document.querySelector(`.cs-opt[data-k="${k}"]`);if(w)w.classList.add('shake')}
      updTrack();break}
    case 'steal':G.res=null;pick();break;
    case 'reveal':G.res='reveal';G.log.push({i:G.i,ok:false,final:true});drawSide();updTrack();break;
    case 'next':G.i++;if(G.i>=G.order.length){stopVid();G.stage='end';draw()}else round();break;
  }}
function updTrack(){const t=document.querySelector('.cs-track');if(!t||!G||!G.order)return;t.innerHTML=G.order.map((_,i)=>{const l=G.log.find(x=>x.i===i&&x.final);return `<i class="${i===G.i&&!l?'now':l?(l.ok?'ok':'no'):''}"></i>`}).join('')}
document.addEventListener('click',e=>{if(e.target.closest('[data-act="startcases"]'))open()});
document.addEventListener('keydown',e=>{if(!G||!$('cs'))return;if(e.key===' '&&G.stage==='play'&&!e.target.closest('button')){e.preventDefault();pp()}});
if(window.speechSynthesis)try{speechSynthesis.getVoices()}catch(e){}
window.__cases={CASES,CAT,playCase,open};
})();

window.__cases.open();
</script></body></html>
