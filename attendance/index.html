<title>تسجيل حضور الاجتماع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Mirza:wght@700&display=swap">
<style>
  /* Layout: one centred column — school card + sign-in form on top, live attendance list below */
  :root{
    --bg:#f6f5f3; --surface:#ffffff; --fg:#2b2b2d; --muted:#76767b; --line:#e4e2df;
    --accent:#ef7f1a; --accent-ink:#ffffff; --accent-soft:#fdf0e3; --ok:#2f8f5b; --danger:#c0392b;
    --display:'Mirza','Cairo',serif; --body:'Cairo',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#1b1b1d; --surface:#252528; --fg:#f0efed; --muted:#a3a3a8; --line:#38383c;
    --accent:#f29238; --accent-ink:#1b1b1d; --accent-soft:#3a2a1b; --ok:#5cc28a; --danger:#e8695b; color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#1b1b1d; --surface:#252528; --fg:#f0efed; --muted:#a3a3a8; --line:#38383c;
    --accent:#f29238; --accent-ink:#1b1b1d; --accent-soft:#3a2a1b; --ok:#5cc28a; --danger:#e8695b; color-scheme:dark}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
  .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  .head{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .head .bar{height:6px;background:var(--accent)}
  .head .inner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 20px 24px;text-align:center}
  .logo{background:#fff;border-radius:10px;padding:8px 14px}
  .logo img{display:block;width:170px;height:auto}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,46px);line-height:1.4;margin:6px 0 0;text-wrap:balance}
  .sub{color:var(--muted);font-weight:600;margin:0}

  form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:700}
  input{font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  .submit{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:19px;padding:13px}
  .submit:disabled{opacity:.55;cursor:default}
  button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
  .msg{min-height:1.6em;margin:0;font-weight:700;text-align:center}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}

  .list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .list-head h2{font-size:19px;margin:0}
  .count{background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
  .ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg);font-weight:700;font-size:14px;padding:6px 12px}
  ol{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  .n{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
  .who{min-width:0}
  .who b{display:block;overflow-wrap:anywhere}
  .who span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .del{background:transparent;color:var(--danger);font-size:13px;font-weight:700;padding:4px 6px}
  .empty{color:var(--muted);text-align:center;padding:18px 0;margin:0}
</style>

<div class="wrap">
  <header class="head">
    <div class="bar"></div>
    <div class="inner">
      <div class="logo"><img src="school-logo.png" alt="شعار ثانوية فاطمة الهاشمية"></div>
      <h1>حيــاكــم اللّــه</h1>
      <p class="sub">سجّل حضورك في غرفة الاجتماعات</p>
    </div>
  </header>

  <form id="f" novalidate>
    <label for="name">الاسم
      <input id="name" name="name" autocomplete="name" required maxlength="80" placeholder="اكتب اسمك الثلاثي">
    </label>
    <label for="school">المدرسة / الجهة
      <input id="school" name="school" list="schools" required maxlength="80" placeholder="اكتب اسم المدرسة">
      <datalist id="schools"></datalist>
    </label>
    <button class="submit" id="go" type="submit">تسجيل الحضور</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section class="list" aria-labelledby="lh">
    <div class="list-head">
      <h2 id="lh">الحضور <span class="count" id="count">0</span></h2>
      <button class="ghost" id="dl" type="button" hidden>تنزيل القائمة (Excel)</button>
    </div>
    <ol id="ol"></ol>
    <p class="empty" id="empty">جاري تحميل قائمة الحضور…</p>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
let db = null, col = null, rows = [], admin = false;
const fmt = t => { try { return new Date(t).toLocaleTimeString('ar-KW',{hour:'numeric',minute:'2-digit'}); } catch { return ''; } };
const say = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + (cls||''); };

function render(){
  $('count').textContent = rows.length;
  const ol = $('ol'); ol.textContent = '';
  rows.forEach((r, i) => {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className='n'; n.textContent = i+1;
    const who = document.createElement('div'); who.className='who';
    const b = document.createElement('b'); b.textContent = r.name;
    const s = document.createElement('span'); s.textContent = r.school;
    who.append(b, s);
    const meta = document.createElement('div'); meta.className='meta';
    const t = document.createElement('span'); t.textContent = fmt(r.at); meta.append(t);
    if (admin){
      const d = document.createElement('button'); d.type='button'; d.className='del'; d.textContent='حذف';
      d.setAttribute('aria-label','حذف ' + r.name);
      d.onclick = async () => {
        if (d.dataset.armed !== '1'){ d.dataset.armed='1'; d.textContent='تأكيد الحذف'; setTimeout(()=>{d.dataset.armed='';d.textContent='حذف';},4000); return; }
        try { await col.doc(r.id).delete(); } catch(e){ say('ما قدرنا نحذف الاسم، حاول مرة ثانية.', 'err'); }
      };
      meta.append(d);
    }
    li.append(n, who, meta); ol.append(li);
  });
  $('empty').hidden = rows.length > 0;
  if (!rows.length) $('empty').textContent = 'ما فيه أحد مسجل للحين. أول من يحضر يكتب اسمه ومدرسته فوق.';
  const schools = [...new Set(rows.map(r => r.school).filter(Boolean))];
  const dlst = $('schools'); dlst.textContent = '';
  schools.forEach(s => { const o = document.createElement('option'); o.value = s; dlst.append(o); });
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim(), school = $('school').value.trim();
  if (!name || !school){ say('اكتب الاسم والمدرسة قبل التسجيل.', 'err'); (name ? $('school') : $('name')).focus(); return; }
  if (!col){ say('التسجيل غير متاح في هذا العرض. افتح الصفحة وأنت مسجل دخول.', 'err'); return; }
  $('go').disabled = true;
  try {
    await col.add({ name, school, at: Date.now() });
    say('تم تسجيل حضورك، حياك الله يا ' + name.split(' ')[0], 'ok');
    $('name').value = ''; $('school').value = ''; $('name').focus();
    setTimeout(() => { if ($('msg').classList.contains('ok')) say(''); }, 4000);
  } catch(err){
    say(err && err.code === 'not_granted' ? 'ما عندك صلاحية التسجيل في هذه الصفحة.' : 'ما تم التسجيل، حاول مرة ثانية.', 'err');
  } finally { $('go').disabled = false; }
});

$('dl').addEventListener('click', async () => {
  const dls = await claude.use('downloads');
  if (!dls) return;
  const esc = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const lines = [['#','الاسم','المدرسة','الوقت'].map(esc).join(',')]
    .concat(rows.map((r,i) => [i+1, r.name, r.school, new Date(r.at).toLocaleString('ar-KW')].map(esc).join(',')));
  const d = new Date(), stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try { await dls.save({ filename: 'الحضور-' + stamp + '.csv', data: '﻿' + lines.join('\r\n') }); }
  catch(e){ if (e && e.code !== 'declined') say('ما قدرنا ننزل الملف.', 'err'); }
});

(async () => {
  const timer = setTimeout(() => { if (!rows.length) $('empty').textContent = 'ما قدرنا نحمّل القائمة. تأكد إنك مسجل دخول.'; }, 10000);
  db = await claude.use('db');
  const user = await claude.use('user');
  admin = user ? !!user.canEdit() : false;
  if (!db){ clearTimeout(timer); $('empty').textContent = 'التسجيل يحتاج تسجيل دخول إلى Claude.'; $('go').disabled = true; return; }
  col = db.collection('attendance');
  col.orderBy('at','asc').onSnapshot(snap => {
    clearTimeout(timer);
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => { clearTimeout(timer); $('empty').textContent = 'ما قدرنا نحمّل القائمة.'; });
  if (admin && await claude.use('downloads')) $('dl').hidden = false;
})();
</script>
