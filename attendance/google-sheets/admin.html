<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الحضور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#f6f5f3; --surface:#ffffff; --fg:#2b2b2d; --muted:#76767b; --line:#e4e2df;
    --accent:#ef7f1a; --accent-soft:#fdf0e3; --ink:#333335; --danger:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;font-size:15px;line-height:1.6;padding:24px 16px 48px}
  .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  button,a.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  button:focus-visible,a.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  input{font:inherit;font-size:17px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0;width:100%}

  .login{max-width:380px;margin:60px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
  .login img{width:130px;margin:0 auto}
  .login h1{margin:0;font-size:22px}
  .primary{background:var(--accent);color:#fff;padding:11px 18px;font-size:17px}
  .err{color:var(--danger);font-weight:700;min-height:1.5em;margin:0}

  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:64px}
  .brand h1{margin:0;font-size:20px;line-height:1.3}
  .brand p{margin:0;color:var(--muted);font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg);padding:7px 14px;font-size:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .stat b{display:block;font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat:first-child b{color:var(--accent)}
  .stat span{color:var(--muted);font-weight:600;font-size:13px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 0}
  .bar{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  .bar input{flex:1 1 220px;font-size:15px;padding:8px 12px}
  .bar small{color:var(--muted)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th,td{text-align:right;padding:10px 16px;border-top:1px solid var(--line);vertical-align:middle}
  th{font-size:13px;color:var(--muted);font-weight:700;background:var(--bg)}
  td.n,td.t{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  td.nm{font-weight:700}
  .school{display:inline-block;background:var(--accent-soft);color:#9a4e0b;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
  .del{background:transparent;color:var(--danger);font-size:13px;padding:4px 8px}
  .empty{text-align:center;color:var(--muted);padding:30px 16px;margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<form class="login" id="login">
  <img src="__LOGO__" alt="شعار ثانوية فاطمة الهاشمية">
  <h1>إدارة الحضور</h1>
  <label for="pw" style="font-weight:700;text-align:right">كلمة السر</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="primary" id="enter" type="submit">دخول</button>
  <p class="err" id="lerr"></p>
</form>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <img src="__LOGO__" alt="">
      <div><h1>حضور اجتماع مديري ومديرات المدارس</h1><p id="updated">جاري التحميل…</p></div>
    </div>
    <div class="actions">
      <button class="ghost" id="refresh" type="button">تحديث</button>
      <button class="ghost" id="csv" type="button">تنزيل القائمة</button>
      <a class="btn ghost" id="sheet" target="_blank" rel="noopener">فتح بإكسل</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="total">0</b><span>عدد الحضور</span></div>
    <div class="stat"><b id="schoolsN">0</b><span>عدد المدارس</span></div>
    <div class="stat"><b id="last">—</b><span>آخر تسجيل</span></div>
  </div>

  <section class="card">
    <div class="bar">
      <input id="q" type="search" placeholder="ابحث بالاسم أو المدرسة">
      <small id="shown"></small>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>الاسم</th><th>المدرسة</th><th>وقت الحضور</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>ما فيه أحد مسجل للحين.</p>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  let PW = '', rows = [], sheetUrl = '';
  const time = ms => new Date(ms).toLocaleTimeString('ar-KW', {hour:'numeric', minute:'2-digit'});
  const full = ms => new Date(ms).toLocaleString('ar-KW', {dateStyle:'medium', timeStyle:'short'});

  function call(fn, ...args){
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](PW, ...args));
  }

  function render(){
    const q = $('q').value.trim();
    const list = rows.filter(r => !q || r.name.includes(q) || r.school.includes(q));
    $('total').textContent = rows.length;
    $('schoolsN').textContent = new Set(rows.map(r => r.school)).size;
    $('last').textContent = rows.length ? time(rows[rows.length-1].at) : '—';
    $('shown').textContent = q ? ('النتائج: ' + list.length) : '';
    const tb = $('tb'); tb.textContent = '';
    list.forEach(r => {
      const tr = document.createElement('tr');
      const c = (cls, txt) => { const td = document.createElement('td'); td.className = cls; td.textContent = txt; return td; };
      const sc = document.createElement('td'); const pill = document.createElement('span'); pill.className = 'school'; pill.textContent = r.school; sc.append(pill);
      const act = document.createElement('td');
      const d = document.createElement('button'); d.type = 'button'; d.className = 'del'; d.textContent = 'حذف';
      d.onclick = async () => {
        if (d.dataset.armed !== '1'){ d.dataset.armed = '1'; d.textContent = 'تأكيد الحذف'; setTimeout(() => { d.dataset.armed = ''; d.textContent = 'حذف'; }, 4000); return; }
        d.disabled = true;
        try { await call('adminDelete', r.id); await load(); } catch(e){ d.disabled = false; alertMsg('ما قدرنا نحذف الاسم.'); }
      };
      act.append(d);
      tr.append(c('n', r.n), c('nm', r.name), sc, c('t', full(r.at)), act);
      tb.append(tr);
    });
    $('empty').hidden = rows.length > 0;
  }
  function alertMsg(t){ $('updated').textContent = t; }

  async function load(){
    try {
      const data = await call('adminList');
      rows = data.rows; sheetUrl = data.sheetUrl;
      $('sheet').href = sheetUrl;
      $('updated').textContent = 'آخر تحديث ' + time(Date.now()) + ' · تتحدث تلقائياً';
      render();
    } catch(e){ alertMsg('ما قدرنا نحدّث القائمة، نحاول مرة ثانية بعد شوي.'); }
  }

  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    PW = $('pw').value; $('enter').disabled = true; $('lerr').textContent = '';
    try {
      await call('adminList');
      $('login').hidden = true; $('app').hidden = false;
      await load();
      setInterval(load, 20000);
    } catch(err){ $('lerr').textContent = 'كلمة السر غلط.'; $('enter').disabled = false; }
  });
  $('refresh').onclick = load;
  $('q').oninput = render;
  $('csv').onclick = () => {
    const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['#','الاسم','المدرسة','وقت الحضور'].map(esc).join(',')]
      .concat(rows.map(r => [r.n, r.name, r.school, full(r.at)].map(esc).join(',')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'الحضور.csv'; document.body.append(a); a.click(); a.remove();
  };
</script>
</body>
</html>
