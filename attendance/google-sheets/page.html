<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الحضور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Mirza:wght@700&display=swap">
<style>
  :root{
    --bg:#f6f5f3; --surface:#ffffff; --fg:#2b2b2d; --muted:#76767b; --line:#e4e2df;
    --accent:#ef7f1a; --accent-soft:#fdf0e3; --ok:#2f8f5b; --danger:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;font-size:16px;line-height:1.6;padding:28px 16px 48px}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  .head{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .bar{height:6px;background:var(--accent)}
  .inner{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 20px 22px;text-align:center}
  .logo{display:block;width:160px;max-width:60%;height:auto}
  h1{font-family:'Mirza','Cairo',serif;font-weight:700;font-size:clamp(36px,9vw,48px);line-height:1.4;margin:8px 0 0;-webkit-text-stroke:.6px var(--fg)}
  .sub{color:var(--muted);font-weight:700;margin:0;font-size:17px}
  form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:700}
  input{font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:19px;padding:13px}
  button:disabled{opacity:.55;cursor:default}
  button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
  .msg{min-height:1.6em;margin:0;font-weight:700;text-align:center}
  .msg.err{color:var(--danger)}
  .done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
  .tick{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
  .done h2{margin:0;font-size:24px}
  .done p{margin:0;color:var(--muted);font-weight:600}
  .num{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
  .again{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-size:15px;padding:8px 16px;margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="bar"></div>
    <div class="inner">
      <img class="logo" src="__LOGO__" alt="شعار ثانوية فاطمة الهاشمية">
      <h1>حيــاكــم اللّــه</h1>
      <p class="sub">سجّل حضورك في غرفة الاجتماعات</p>
    </div>
  </header>

  <form id="f" novalidate>
    <label for="name">الاسم
      <input id="name" autocomplete="name" maxlength="80" placeholder="اكتب اسمك">
    </label>
    <label for="school">المدرسة / الجهة
      <input id="school" list="schools" maxlength="80" placeholder="اكتب اسم المدرسة">
      <datalist id="schools"></datalist>
    </label>
    <button id="go" type="submit">تسجيل الحضور</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section class="done" id="done" hidden>
    <div class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef7f1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="thanks">تم تسجيل حضورك</h2>
    <p>رقم الحضور: <span class="num" id="num"></span></p>
    <button class="again" id="again" type="button">تسجيل شخص آخر</button>
  </section>
</div>
<script>
  const $ = id => document.getElementById(id);
  const say = (t) => { $('msg').textContent = t; $('msg').className = 'msg err'; };
  google.script.run.withSuccessHandler(list => {
    (list || []).forEach(s => { const o = document.createElement('option'); o.value = s; $('schools').append(o); });
  }).getSchools();
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('name').value.trim(), school = $('school').value.trim();
    if (!name || !school) { say('اكتب الاسم والمدرسة قبل التسجيل.'); (name ? $('school') : $('name')).focus(); return; }
    $('go').disabled = true; $('go').textContent = 'جاري التسجيل…'; $('msg').textContent = '';
    google.script.run
      .withSuccessHandler(n => {
        $('thanks').textContent = 'حياك الله يا ' + name.split(/\s+/)[0];
        $('num').textContent = n;
        $('f').hidden = true; $('done').hidden = false;
        $('go').disabled = false; $('go').textContent = 'تسجيل الحضور';
      })
      .withFailureHandler(() => {
        say('ما تم التسجيل، تأكد من الإنترنت وحاول مرة ثانية.');
        $('go').disabled = false; $('go').textContent = 'تسجيل الحضور';
      })
      .register(name, school);
  });
  $('again').addEventListener('click', () => {
    $('name').value = ''; $('school').value = '';
    $('done').hidden = true; $('f').hidden = false; $('name').focus();
  });
</script>
</body>
</html>
